<title>Aetherforge</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: one full-screen aether chart with brass instrument plates pinned to its corners; ports and battles open over it. Single dark look by design. */
:root{
  --wood:#24180f; --wood-2:#33241a; --wood-3:#42301f;
  --brass:#c9a14a; --brass-hi:#e8c873; --brass-lo:#7d6029;
  --parch:#efe2c4; --ink:#2a1d12;
  --aether:#0e131b;
  --fg:#efe2c4; --fg-2:#c7b691; --fg-3:#93845f;
  --good:#8fbf6a; --warn:#e0a24a; --bad:#e0613f;
  --display:"IM Fell English SC","Iowan Old Style",Georgia,serif;
  --serif:"IM Fell English","Iowan Old Style",Georgia,serif;
  --ui:"Alegreya Sans","Gill Sans","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;}
body{margin:0;background:var(--aether);color:var(--fg);font:16px/1.4 var(--ui);overflow:hidden;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
canvas.stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;}
button{font:inherit;color:inherit;cursor:pointer}
.b{background:var(--wood-2);border:1.5px solid var(--brass);color:var(--parch);border-radius:5px;padding:8px 14px;font:500 15px/1.15 var(--ui);letter-spacing:.01em;min-height:40px}
.b:hover{background:var(--wood-3);border-color:var(--brass-hi)}
.b:active{transform:translateY(1px)}
.b:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brass-hi);outline-offset:2px}
.b.main{background:var(--brass);color:var(--ink);border-color:var(--brass-hi);font-weight:700}
.b.main:hover{background:var(--brass-hi)}
.b.sm{padding:5px 10px;min-height:32px;font-size:14px}
.b[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.key{display:inline-block;min-width:1.3em;padding:0 .3em;border:1px solid var(--brass-lo);border-radius:3px;font-size:.8em;color:var(--brass-hi);margin-right:.35em;text-align:center}
.plate{background:var(--wood);border:2px solid var(--brass);border-radius:8px;box-shadow:inset 0 0 0 4px var(--wood),inset 0 0 0 5px var(--brass-lo);}
.num{font-variant-numeric:tabular-nums}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none}
#hud>*{pointer-events:auto}
#plateTL{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));padding:10px 14px;max-width:min(330px,60vw)}
#plateTL .where{font:22px/1.1 var(--display);color:var(--brass-hi)}
#plateTL .sub{font-size:14px;color:var(--fg-2);margin-top:3px}
#gauges{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));width:200px;padding:12px 14px}
#compass{display:block;width:96px;height:96px;margin:0 auto 4px}
.cap{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);text-align:center}
.g{margin-top:8px}
.g .lbl{display:flex;justify-content:space-between;font-size:13px;color:var(--fg-2)}
.g .bar{height:8px;border:1px solid var(--brass-lo);border-radius:2px;background:#170f09;margin-top:2px;overflow:hidden}
.g .bar i{display:block;height:100%;background:var(--brass)}
.stat{display:flex;justify-content:space-between;font-size:14px;margin-top:6px;color:var(--fg-2)}
.stat b{color:var(--parch);font-weight:500}
#gaugeToggle{display:none}
#barB{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:max-content;max-width:calc(100% - 24px)}
#barB .b.on{background:var(--brass);color:var(--ink)}
#barB .b.on .key{color:var(--ink);border-color:var(--ink)}
#nearby{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;align-items:center;max-width:calc(100% - 24px)}
#nearby .b{background:var(--ink);box-shadow:0 0 0 3px rgba(201,161,74,.25)}
#toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--parch);color:var(--ink);font:500 15px/1.3 var(--ui);padding:9px 16px;border-radius:5px;border:2px solid var(--brass-lo);max-width:min(460px,calc(100% - 32px));text-align:center;z-index:50;transition:opacity .3s;pointer-events:none}
#toast[data-off]{opacity:0}

/* Panels */
#veil{position:fixed;inset:0;background:rgba(8,6,4,.72);display:flex;align-items:center;justify-content:center;z-index:20;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
#panel{width:min(760px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
#panel header{padding:16px 20px 10px;border-bottom:1px solid var(--brass-lo);display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
#panel h2{margin:0;font:28px/1.05 var(--display);color:var(--brass-hi);text-wrap:balance}
#panel .tag{font-size:14px;color:var(--fg-2)}
#panel .body{padding:16px 20px;overflow:auto;min-height:0}
#panel footer{padding:12px 20px;border-top:1px solid var(--brass-lo);display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.tabs{display:flex;gap:4px;flex-wrap:wrap;padding:0 20px;border-bottom:1px solid var(--brass-lo)}
.tab{background:none;border:0;border-bottom:3px solid transparent;color:var(--fg-2);padding:10px 12px 8px;font:500 15px var(--ui)}
.tab[aria-selected="true"]{color:var(--brass-hi);border-color:var(--brass)}
.prose{font:17px/1.55 var(--serif);color:var(--parch);max-width:62ch}
.prose p{margin:0 0 .8em}
.note{font-size:14px;color:var(--fg-3)}
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t th{text-align:left;font-weight:500;color:var(--fg-3);font-size:12px;letter-spacing:.07em;text-transform:uppercase;padding:4px 6px;border-bottom:1px solid var(--brass-lo)}
table.t td{padding:6px;border-bottom:1px solid rgba(125,96,41,.35);vertical-align:middle}
table.t td.r,table.t th.r{text-align:right}
.cheap{color:var(--good)} .dear{color:var(--warn)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.card{border:1px solid var(--brass-lo);border-radius:6px;padding:12px;background:var(--wood-2);min-width:0}
.card h3{margin:0 0 4px;font:20px/1.1 var(--display);color:var(--brass-hi)}
.docHead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 20px 8px}
#panel h2.docLabel{font:500 13px/1.3 var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--fg-2);margin:0}
.prose.doc{max-width:none;font-size:16px}
.prose.doc h3{font:20px/1.2 var(--display);color:var(--brass-hi);margin:16px 0 6px}
.prose.doc h3:first-child{margin-top:0}
.prose.doc ul{margin:0 0 .8em;padding-left:1.2em}
.prose.doc li{margin:3px 0}
.prose.doc table.t{font:15px/1.4 var(--ui);margin:4px 0 12px}
.prose.doc table.t td{vertical-align:top}
.quote{border-left:3px solid var(--brass);background:var(--wood-2);padding:10px 14px;font-style:italic;margin:0 0 14px!important}
.linkBtn{background:none;border:0;padding:0;font:inherit;color:var(--brass-hi);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.linkBtn:hover{color:var(--parch)}
.tBox{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.tSave{color:var(--fg-3);font-size:15px;min-height:1.2em}
.tBtns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.tLinks{font-size:16px;color:var(--fg-3)}
#panel.titleMode{background:none;border:0;box-shadow:none;width:min(560px,100%)}
#veil.clear{background:radial-gradient(ellipse at center,rgba(8,6,4,.72) 0,rgba(8,6,4,.45) 45%,rgba(8,6,4,.15) 80%)}
.tBox .title h1,.tBox .motto{text-shadow:0 2px 12px rgba(0,0,0,.8)}
.pips{color:var(--brass-hi);letter-spacing:1px;font-size:13px}
.card.upg{padding:10px 12px}
canvas.shippic[data-mine]{height:190px}
.netCode{font:34px/1.1 var(--display);letter-spacing:.08em;color:var(--brass-hi);user-select:text;-webkit-user-select:text}
.netLog{max-height:190px;overflow:auto;border:1px solid var(--brass-lo);border-radius:4px;padding:6px 10px;background:#170f09}
#hNet{display:block;margin-top:4px;font-size:14px;text-align:left}
canvas.shippic{display:block;width:100%;height:130px;border:1px solid var(--brass-lo);border-radius:4px;margin-bottom:10px;max-width:100%}
.patron{display:grid;grid-template-columns:112px minmax(0,1fr);gap:14px;align-items:start;padding:12px;border:1px solid var(--brass-lo);border-radius:6px;background:var(--wood-2)}
.patron canvas{width:112px;height:140px;display:block}
.patron .who{font:19px/1.1 var(--display);color:var(--brass-hi)}
.patron .kind{font-size:13px;color:var(--fg-3);margin:2px 0 6px}
.patron .say{font:16px/1.5 var(--serif);font-style:italic;color:var(--parch)}
label.f{display:block;font-size:13px;color:var(--fg-3);letter-spacing:.06em;text-transform:uppercase;margin:12px 0 4px}
input.f,select.f{width:100%;box-sizing:border-box;background:#170f09;border:1.5px solid var(--brass-lo);color:var(--parch);font:17px var(--serif);padding:8px 10px;border-radius:4px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.choice{text-align:left;background:var(--wood-2);border:1.5px solid var(--brass-lo);border-radius:6px;padding:9px 11px;color:var(--parch)}
.choice b{display:block;font:500 15px var(--ui);color:var(--brass-hi)}
.choice span{font-size:13px;color:var(--fg-2)}
.choice[aria-pressed="true"]{border-color:var(--brass-hi);background:var(--wood-3);box-shadow:inset 0 0 0 1px var(--brass-hi)}
.title{text-align:center;padding:10px 0 4px}
.title h1{margin:0;font:clamp(46px,9vw,78px)/1 var(--display);color:var(--brass-hi);letter-spacing:.02em}
.title .ver{font:15px var(--ui);color:var(--fg-3);margin-top:6px;letter-spacing:.12em}
.title .motto{font:italic 18px/1.4 var(--serif);color:var(--fg-2);margin-top:12px}
.log{font-size:15px;line-height:1.45}
.log div{padding:4px 0;border-bottom:1px solid rgba(125,96,41,.3)}
.log .d{color:var(--fg-3);font-size:13px;margin-right:6px}

/* Battle */
canvas.scene{display:block;width:100%;height:130px;border:1px solid var(--brass-lo);border-radius:4px;margin-bottom:10px;max-width:100%}
canvas.scene.wide{height:170px}
canvas.scene.tall{height:210px}
.facts{margin:0;padding-left:1.1em;font-size:14px;color:var(--parch)} .facts li{margin:2px 0}
.choices.one{grid-template-columns:1fr;margin-top:4px}
.xbar{display:flex;gap:4px;margin:0 0 10px} .xbar i{flex:1;height:6px;border:1px solid var(--brass-lo);border-radius:3px;background:#170f09} .xbar i.on{background:var(--brass)}
.chks{display:grid;gap:6px} .chk{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:15px;color:var(--parch)} .chk input{width:18px;height:18px;accent-color:var(--brass)}
.b[disabled]{opacity:.45;cursor:default}
@media (max-width:640px){canvas.scene.wide{height:130px} canvas.scene.tall{height:150px}}
#dhud{position:fixed;inset:0;pointer-events:none;z-index:10}
#dhud>*{pointer-events:auto}
#dTop{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:12px;right:12px;display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;padding:8px 12px}
#dTop .nm{font:16px var(--display,inherit);color:var(--brass-hi)}
#dTop .r{text-align:right}
#dTop .sub{font-size:13px;color:var(--fg-2)}
#dAdv{grid-column:1/3;height:8px;background:#7a2a22;border:1px solid var(--brass-lo);border-radius:4px;overflow:hidden}
#dAdvBar{height:100%;width:50%;background:#8fbf6a;transition:width .4s}
#dCtl{position:absolute;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;pointer-events:none}
#dCtl>div{display:grid;gap:6px;pointer-events:auto}
#dDef{grid-template-columns:repeat(3,auto)}
#dAtk{grid-template-columns:repeat(3,auto)}
#dAtk .wide{grid-column:span 1}
#dCtl .b{min-width:56px;min-height:48px;touch-action:none}
@media (max-width:640px){
  #dCtl{flex-direction:column;align-items:stretch}
  #dCtl>div{grid-template-columns:repeat(3,minmax(0,1fr))}
  #dCtl .b{min-width:0;padding:6px 4px;font-size:13px;white-space:nowrap}
}
#bhud{position:fixed;inset:0;pointer-events:none;z-index:10}
#bhud>*{pointer-events:auto}
.shipcard{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));width:190px;padding:10px 12px}
#bMine{left:max(12px,env(safe-area-inset-left,0px))}
#bFoe{right:max(12px,env(safe-area-inset-right,0px))}
.shipcard .nm{font:18px/1.1 var(--display);color:var(--brass-hi)}
.shipcard .ty{font-size:13px;color:var(--fg-3)}
#bCtl{position:absolute;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:flex-end;gap:10px;pointer-events:none}
#bCtl>div{display:flex;gap:6px;pointer-events:auto;flex-wrap:wrap}
#bCtl .b{min-width:56px;min-height:48px}
#bCtl .shot.sel,#bCtl .b.on{background:var(--brass);color:var(--ink)}
#bActs{flex-direction:column;align-items:flex-end}
#bCtl .bRow{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
#bCtl .ico{display:none}
#bCtl .coal{font-size:12px;opacity:.8}
#bCtl .b.on .key,#bCtl .shot.sel .key{color:var(--ink);border-color:var(--ink)}
#bMsg{position:absolute;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);font:20px var(--display);color:var(--brass-hi);text-align:center;max-width:calc(100% - 440px);text-shadow:0 1px 3px #000}

@media (max-width:640px){
  #bCtl .lbl{display:none}
  #bCtl .ico{display:inline}
  #bCtl .coal{display:none}
  #bCtl{align-items:flex-end}
  #bSteer{flex-direction:column;flex:none}
  #bActs{flex:1;min-width:0;align-items:stretch}
  #bCtl .bRow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
  #bCtl .bRow+.bRow{grid-template-columns:repeat(3,minmax(0,1fr))}
  #bCtl .b{min-width:0;padding:6px 4px;font-size:13px;white-space:nowrap}
  #bCtl .key{margin-right:.25em}
  #bSteer .b{min-width:52px;width:52px;padding:6px 0}
  #gauges{width:auto;padding:8px 10px}
  #gauges .more{display:none}
  #gauges.open .more{display:block}
  #gaugeToggle{display:block;margin:6px auto 0}
  #compass{width:64px;height:64px}
  #plateTL{max-width:calc(100% - 150px)}
  #plateTL .where{font-size:18px}
  .shipcard{width:150px;padding:8px}
  #bMsg{max-width:calc(100% - 24px);font-size:17px}
  .patron{grid-template-columns:84px minmax(0,1fr)}
  .patron canvas{width:84px;height:105px}
  #panel h2{font-size:23px}
  #nearby{bottom:calc(122px + env(safe-area-inset-bottom,0px))}
  #bMsg{top:calc(200px + env(safe-area-inset-top,0px));bottom:auto}
  table.t td,table.t th{padding:5px 3px}
  table.t .hideN{display:none}
  .mk .b.sm{padding:4px 7px;min-height:34px;font-size:13px}
  .mk .row{flex-wrap:nowrap}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>

<canvas id="map" class="stage" aria-label="Chart of the solar aether"></canvas>
<canvas id="battle" class="stage" hidden aria-label="Battle"></canvas>

<div id="hud" hidden>
  <div id="plateTL" class="plate">
    <div class="where" id="hWhere">In the aether</div>
    <div class="sub num" id="hDate">1 January 1889</div>
    <div class="sub" id="hRank"></div>
    <button class="linkBtn sub" id="hNet" hidden></button>
  </div>
  <div id="gauges" class="plate">
    <canvas id="compass" width="192" height="192" aria-label="Aether wind compass"></canvas>
    <div class="cap">Aether wind</div>
    <div class="more">
      <div class="g"><div class="lbl"><span>Hull</span><span class="num" id="gHullT"></span></div><div class="bar"><i id="gHull"></i></div></div>
      <div class="g"><div class="lbl"><span>Ether vanes</span><span class="num" id="gVaneT"></span></div><div class="bar"><i id="gVane"></i></div></div>
      <div class="g"><div class="lbl"><span>Crew morale</span><span class="num" id="gMorT"></span></div><div class="bar"><i id="gMor"></i></div></div>
      <div class="stat"><span>Gold</span><b class="num" id="sGold"></b></div>
      <div class="stat"><span>Crew</span><b class="num" id="sCrew"></b></div>
      <div class="stat"><span>Provisions</span><b class="num" id="sFood"></b></div>
      <div class="stat"><span>Coal</span><b class="num" id="sCoal"></b></div>
      <div class="stat"><span>Hold</span><b class="num" id="sHold"></b></div>
    </div>
    <button class="b sm" id="gaugeToggle" aria-expanded="false">Ship</button>
  </div>
  <div id="nearby"></div>
  <div id="barB">
    <button class="b" id="btnBoil" title="Stoke the boilers (B)"><span class="key">B</span>Boilers</button>
    <button class="b" id="btnPause" title="Heave to (Space)"><span class="key">␣</span>Heave to</button>
    <button class="b sm" id="btnZoomOut" aria-label="Zoom out">−</button>
    <button class="b sm" id="btnZoomIn" aria-label="Zoom in">+</button>
    <button class="b" id="btnMenu" title="Pause menu (P)"><span class="key">P</span>Menu</button>
    <button class="b" id="btnHold" hidden>Holdings</button>
    <button class="b" id="btnFleet" hidden>Fleet</button>
    <button class="b" id="btnOff">Officers</button>
    <button class="b" id="btnCaptain">Captain</button>
    <button class="b" id="btnLog">Log</button>
  </div>
</div>

<div id="bhud" hidden>
  <div id="bMine" class="plate shipcard"></div>
  <div id="bFoe" class="plate shipcard"></div>
  <div id="bMsg"></div>
  <div id="bCtl">
    <div id="bSteer">
      <button class="b" id="bLeft" aria-label="Turn to port">◀</button>
      <button class="b" id="bRight" aria-label="Turn to starboard">▶</button>
    </div>
    <div id="bActs">
      <div class="bRow">
        <button class="b" id="bPause" aria-label="Pause"><span class="key">P</span><span class="lbl">Pause</span><span class="ico">❚❚</span></button>
        <button class="b" id="bSlow" aria-label="Less sail"><span class="key">S</span><span class="lbl">Less sail</span><span class="ico">−</span></button>
        <button class="b" id="bFast" aria-label="More sail"><span class="key">W</span><span class="lbl">More sail</span><span class="ico">+</span></button>
        <button class="b" id="bBoil" aria-label="Boilers"><span class="key">B</span><span class="lbl">Boilers</span><span class="ico">Steam</span> <span class="num coal" id="bCoal"></span></button>
      </div>
      <div class="bRow">
        <button class="b shot" data-shot="solid"><span class="key">Z</span>Solid</button>
        <button class="b shot" data-shot="chain"><span class="key">X</span>Chain</button>
        <button class="b shot" data-shot="canister"><span class="key">C</span>Canister</button>
      </div>
    </div>
  </div>
</div>

<div id="dhud" hidden>
  <div id="dTop" class="plate">
    <div><div class="nm" id="dMeName"></div><div class="sub num" id="dMeCrew"></div></div>
    <div class="r"><div class="nm" id="dFoeName"></div><div class="sub num" id="dFoeCrew"></div></div>
    <div id="dAdv" aria-label="How the crews' fight is going"><div id="dAdvBar"></div></div>
  </div>
  <div id="dCtl">
    <div id="dDef">
      <button class="b" data-act="duck"><span class="key">↓</span>Duck</button>
      <button class="b" data-act="parry"><span class="key">←</span>Parry</button>

function human2(c,b,r,ph,walking){

  const arm=(p,col,front)=>{c.save();c.translate(-.5,-73);c.rotate(-Math.sin(p)*.36);
    tap(c,15.5,7.4*build,5.6,col,.9);                                    // upper arm

  Skarr:    ["You. Sit. Talk.", "Your hand is soft, captain. Is your blade?", "Speak quickly. I am drinking."],
  Lumari:   ["Gooood... seasons... to you.", "Sit in the light, small one.", "The swamp knows your ship's name already."],
  Kesh:     ["Captain. You came in from the north-east, nine degrees off true.", "Tik. Captain. Well met.", "Your navigator is lost. Not me. Yours."],
  Selenn:   ["(a soft chime) Welcome, warm one.", "Light falls kindly on you today.", "(two clear notes) You have questions."],
  Vorrn:    ["Hrrm. Captain.", "Sit. Mind the table, it's bolted down.", "Your hull plates are rattling. I heard you dock."],
  Krillian: ["Buying or selling, captain? Both? Lovely.", "Clack! A customer!", "Psst. Captain. Want to know a thing?"]
};

// ---------- helpers ----------
function ensureV2() {
  if (!G) return;
  if ((G.worldScale || 1) !== WORLD) {
    const k = WORLD / (G.worldScale || 1), sc = o => { if (o && typeof o.x === "number") { o.x *= k; o.y *= k; } };
    sc(G.ship); (G.ais || []).forEach(a => { sc(a); sc(a.wp); }); (G.storms || []).forEach(st => { sc(st); st.vx *= k; st.vy *= k; });
    if (G.target && !G.target.port && !G.target.ai) sc(G.target);
    G.worldScale = WORLD;
  }
  G.officers = G.officers || [];
  G.lost = G.lost || [];
  G.srep = G.srep || Object.fromEntries(NATIVE.map(s => [s, 0]));
  for (const s of NATIVE) if (G.srep[s] == null) G.srep[s] = 0;
  if (G.nextWage == null) G.nextWage = Math.floor(G.day) + 30;
  if (G.writ == null) G.writ = false;
  if (G.mrank == null) G.mrank = 0;
  if (G.mission === undefined) G.mission = null;
  if (G.nextOff == null) G.nextOff = 1;
  if (!G.fleet) G.fleet = [];
  if (!G.ship.up) { G.ship.up = noUps(); G.ship.upSpent = 0; }
  if (!G.gid) G.gid = Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
  if (G.lastPrize == null) G.lastPrize = Math.floor(G.day);
  ensureLand(); ensureStory();
  G.v = VERSION;
}
const officerAt = post => G.officers.find(o => o.post === post);
function eff(post) { const o = officerAt(post); if (!o) return 0; return o.skill / 10 * (o.wounded > G.day ? 0.5 : 1); }
function srepChange(sp, d) { if (!G.srep || G.srep[sp] == null) return; G.srep[sp] = clamp(G.srep[sp] + d, -100, 100); }
// ---- Officer pay, Pirates!-style: a tiny retainer plus a share of every prize. Tune here. ----
const PAY = {
  retainerPerSkill: 2,      // £ a month per skill point (skill 1 = £2, skill 10 = £20)
  shareMin: 1, shareMax: 3, // % of prize gold, skill 1 to skill 10
  signPerSkill: 5,          // £ signing money per skill point
  restlessDays: 90          // days without a prize before officers grow restless
};
const wageOf = o => Math.round(PAY.retainerPerSkill * o.skill);
const shareOf = o => PAY.shareMin + (PAY.shareMax - PAY.shareMin) * (o.skill - 1) / 9;
const signOf = o => Math.round(PAY.signPerSkill * o.skill);
const monthlyWages = () => G.officers.reduce((s, o) => s + wageOf(o), 0);
const totalShare = () => G.officers.reduce((s, o) => s + shareOf(o), 0);
// Officers take their cut of prize gold; returns what's left for the captain.
function payShares(gold) {
  if (!G.officers.length || gold <= 0) return { left: gold, paid: 0 };
  const paid = Math.round(gold * totalShare() / 100);
  for (const o of G.officers) o.loyalty = clamp(o.loyalty + 3, 0, 100);
  G.lastPrize = Math.floor(G.day);
  return { left: gold - paid, paid };
}
function makeOfficer(sp, port) {
  let post;
  if (sp === "Human") post = pickOne(Object.keys(POSTS));
  else { const best = Object.keys(POSTS).find(k => POSTS[k].best === sp); post = Math.random() < 0.8 ? best : pickOne(Object.keys(POSTS)); }
  const native = POSTS[post].best === sp;
  const cap = native ? 10 : sp === "Human" ? 7 : 5;
  const skill = clamp(ri(2, cap), 1, cap);
  return { id: G.nextOff++, name: speciesName(sp), sp, post, skill, cap, loyalty: ri(45, 65), trait: pickOne(TRAITS[sp]), seed: ri(1, 99999), wounded: 0, hired: 0, from: port.id };
}
function rankTitle() { return G.writ ? MARTIAN_RANKS[G.mrank] : RANKS[G.rank].t; }

// ---------- officer events ----------
function officersDaily() {
  const s = G.ship;
  // engineer repairs at sea, up to 80%
  const e = eff("eng");
  if (e > 0 && !G.docked) { const d = shipDef(); if (s.hull < d.hull * 0.8) s.hull = Math.min(d.hull * 0.8, s.hull + 0.8 * e); if (s.vanes < d.vanes * 0.8) s.vanes = Math.min(d.vanes * 0.8, s.vanes + 0.6 * e); }
  for (const o of G.officers) {
    if (s.morale < 20) o.loyalty -= 1.5;
    if (G.lastPrize != null && G.day - G.lastPrize > PAY.restlessDays) { o.loyalty -= 0.5; if (Math.floor(G.day) % 15 === 0 && o === G.officers[0]) toast("The officers are restless. No prize money in months.", 3500); }
    if (G.srep[o.sp] != null && G.srep[o.sp] < -30) o.loyalty -= 2;
    o.loyalty = clamp(o.loyalty, 0, 100);
  }
  // wages, monthly
  if (Math.floor(G.day) >= G.nextWage) {
    G.nextWage = Math.floor(G.day) + 30;
    const due = monthlyWages();
    if (due > 0) {
      if (G.gold >= due) { G.gold -= due; for (const o of G.officers) o.loyalty = clamp(o.loyalty + 3, 0, 100); logMsg(`Paid the officers ${fmtGold(due)} in retainers.`); }
      else { for (const o of G.officers) { o.loyalty -= 22; srepChange(o.sp, -2); } toast(`You couldn't pay the officers' retainers (${fmtGold(due)}). They are not pleased.`, 4200); logMsg("Missed the officers' retainers."); }
    }
    // a month at sea can teach a lesson
    for (const o of G.officers) if (o.skill < o.cap && Math.random() < 0.18) { o.skill++; toast(`${o.name} has grown more skilled (${POSTS[o.post].n}, now ${o.skill}).`, 3000); }
  }
}
// called whenever you make port: unhappy officers walk off
function officersAtPort() {
  const gone = [];
  for (const o of [...G.officers]) {
    let why = null;
    if (o.loyalty < 15) why = "is tired of empty promises and has signed off";
    else if (G.srep[o.sp] != null && G.srep[o.sp] <= -40) why = `won't serve a captain who is an enemy of the ${SPECIES_AF[o.sp].n}`;
    if (why) { G.officers = G.officers.filter(x => x !== o); G.lost.unshift({ name: o.name, sp: o.sp, post: o.post, fate: "left", d: Math.floor(G.day) }); srepChange(o.sp, -3); logMsg(`${o.name}, ${POSTS[o.post].n.toLowerCase()}, ${why}.`); gone.push(`${o.name} ${why}.`); }
  }
  if (gone.length) toast(gone.join(" "), 5000);
}
// after any battle: officers may be wounded or killed
function officerCasualties(hullLostFrac, boarded, lost) {
  const notes = [];
  const surgeon = officerAt("surgeon");
  for (const o of [...G.officers]) {
    let risk = hullLostFrac * 0.18 + (boarded ? (o.post === "marine" ? 0.22 : 0.08) : 0) + (lost ? 0.25 : 0);
    if (Math.random() >= risk) continue;
    const save = surgeon && surgeon !== o ? eff("surgeon") * 0.7 : 0;
    if (Math.random() < 0.45 - save * 0.45) {
      G.officers = G.officers.filter(x => x !== o);
      G.lost.unshift({ name: o.name, sp: o.sp, post: o.post, fate: "killed", d: Math.floor(G.day) });
      srepChange(o.sp, -2); for (const x of G.officers) x.loyalty -= 4;
      logMsg(`${o.name}, ${POSTS[o.post].n.toLowerCase()}, was killed in action.`);
      notes.push(`${o.name}, your ${POSTS[o.post].n.toLowerCase()}, was killed.`);
    } else {
      o.wounded = G.day + 20;
      notes.push(`${o.name} was wounded${surgeon && surgeon !== o ? `; ${surgeon.name} is tending the wound` : ""}.`);
    }
  }
  return notes;
}
function officersAfterDefeat() {
  const stay = [], left = [];
  for (const o of G.officers) (o.loyalty >= 70 && Math.random() < 0.85 ? stay : left).push(o);
  for (const o of left) { G.lost.unshift({ name: o.name, sp: o.sp, post: o.post, fate: "left", d: Math.floor(G.day) }); logMsg(`${o.name} went their own way after the ship was lost.`); }
  G.officers = stay;
  return stay.length ? ` ${stay.map(o => o.name).join(" and ")} ${stay.length > 1 ? "stuck" : "stuck"} by you.` : "";
}

// ---------- species standing from your deeds ----------
function speciesFromAttack(a, won) {
  if (a.nat === "mars") { srepChange("Ossari", won ? -10 : -5); srepChange("Skarr", 2); }
  if (a.corsair) { srepChange("Skarr", won ? -8 : -4); srepChange("Ossari", won ? 6 : 2); }
  if (a.role === "pirate" && !a.corsair) srepChange("Krillian", won ? -2 : 0);
  if (G.writ && GREAT.includes(a.nat)) { srepChange("Ossari", won ? 3 : 1); srepChange("Skarr", won ? 2 : 1); }
}
function speciesFromTrade(port, good, n, buying) {
  if (buying && good === "rubber" && PORT[port].kind === "colony" && PORT[port].body === "venus") srepChange("Lumari", -0.25 * n);
  if (buying && good === "apergy" && port === "ceres") srepChange("Vorrn", 0.15 * n);
  if (!buying && (PORT[port].kind === "haven")) srepChange("Krillian", 0.1 * n);
  if (!buying && port === "thothka" && (good === "machinery" || good === "firearms")) srepChange("Ossari", 0.15 * n);
  if (!buying && port === "hermes" && (good === "provisions" || good === "coal")) srepChange("Selenn", 0.05 * n);
}

function paintPortraits(root) { root.querySelectorAll("canvas[data-por]").forEach(cv => { const [sp, seed] = cv.dataset.por.split("|"); brassPortrait(cv, sp, +seed); }); }

// ---------- the Prince's Writ ----------
function princeOffer() { return !G.writ && G.rep.mars >= 40 && G.srep.Ossari >= 20; }
function acceptWrit() {
  G.writ = true; G.mrank = 1;
  const old = G.nation;
  G.rep[old] = clamp(G.rep[old] - 35, -100, 100);
  for (const n of GREAT) if (n !== old) G.rep[n] = clamp(G.rep[n] - 10, -100, 100);
  G.marque = [];
  G.rep.mars = clamp(G.rep.mars + 10, -100, 100); srepChange("Ossari", 10); srepChange("Skarr", 5);
  logMsg(`Accepted the Prince's Writ of Thoth-Ka. Now sailing as a ${MARTIAN_RANKS[1]}.`);
}
function newCommission() {
  const targets = GREAT.filter(n => n !== "mars");
  const nat = pickOne(targets);
  G.mission = { type: "prize", nat, due: Math.floor(G.day) + 75, reward: ri(5, 9) * 100, done: false };
}
function missionVictory(a) {
  if (G.mission && !G.mission.done && G.mission.type === "prize" && a.nat === G.mission.nat && a.role !== "pirate") { G.mission.done = true; toast(`That prize fulfils the prince's commission. Return to Thoth-Ka for your reward.`, 4200); }
}
function renderPalace(p) {

  let html = `<div class="prose"><p>The Ossari prince of Thoth-Ka receives you on a balcony above the canal, attended by a dozen silent Skarr guards. The water below is lower than it was last year.</p>
    <p>Your standing with the city-states is <b>${repWord(rv).toLowerCase()}</b>; with the Ossari, <b>${repWord(os).toLowerCase()}</b>.</p></div>`;

    else cards.push(`<div class="card"><h3>The Prince's Writ</h3><p class="note">The prince might trust an outlander with his writ one day. He'd need respected standing with the city-states (you: ${Math.round(rv)} of 40) and friendship with the Ossari (you: ${Math.round(os)} of 20).</p></div>`);
  } else {
    const next = MARTIAN_RANKS[G.mrank + 1], need = RANKS[Math.min(G.mrank + 1, RANKS.length - 1)].f;
    if (next && G.fame >= need && rv >= 30) cards.push(`<div class="card"><h3>A court title</h3><p class="note">The prince would raise you to ${next}.</p><button class="b sm main" id="pRank">Kneel and accept</button></div>`);
    else if (next) cards.push(`<div class="card"><h3>Court titles</h3><p class="note">You are ${MARTIAN_RANKS[G.mrank]}. ${next} needs ${need} fame (you have ${Math.floor(G.fame)}) and respected standing.</p></div>`);
    else cards.push(`<div class="card"><h3>The Prince's Hand</h3><p class="note">No outlander has ever stood higher in a Martian court.</p></div>`);

    else if (m && G.day > m.due) cards.push(`<div class="card"><h3>Commission failed</h3><p class="note">The prince waited, and you did not deliver.</p><button class="b sm" id="pFail">Bow and apologise</button></div>`);
    else if (m) cards.push(`<div class="card"><h3>The prince's commission</h3><p class="note">Take a ${NATIONS[m.nat].adj} ship as a prize by ${dateStr(m.due)}. Reward: ${fmtGold(m.reward)}.</p></div>`);
    else cards.push(`<div class="card"><h3>A commission</h3><p class="note">The prince has work for his writ-holders: a blow against the colonies.</p><button class="b sm main" id="pTake">Hear his commission</button></div>`);
  }
  $("portBody").innerHTML = html + `<div class="grid2" style="margin-top:12px">${cards.join("")}</div>`;
  if ($("pWrit")) $("pWrit").onclick = () => { acceptWrit(); toast(`You kneel before the prince. You are now ${MARTIAN_RANKS[1]} of Thoth-Ka, and a renegade to the empires.`, 5000); openPort(p.id, "gov"); };
  if ($("pRank")) $("pRank").onclick = () => { G.mrank++; const r = 350 * G.mrank; G.gold += r; logMsg(`Raised to ${MARTIAN_RANKS[G.mrank]} of Thoth-Ka.`); toast(`You rise as ${MARTIAN_RANKS[G.mrank]}. The prince gifts you ${fmtGold(r)}.`, 4500); openPort(p.id, "gov"); };
  if ($("pClaim")) $("pClaim").onclick = () => { G.gold += G.mission.reward; G.fame += 8; G.rep.mars += 8; srepChange("Ossari", 4); logMsg(`Fulfilled the prince's commission for ${fmtGold(G.mission.reward)}.`); G.mission = null; openPort(p.id, "gov"); };
  if ($("pFail")) $("pFail").onclick = () => { G.rep.mars -= 8; srepChange("Ossari", -4); G.mission = null; openPort(p.id, "gov"); };
  if ($("pTake")) $("pTake").onclick = () => { newCommission(); logMsg(`The prince commissioned a ${NATIONS[G.mission.nat].adj} prize.`); openPort(p.id, "gov"); };
}

// ===================== SHIP ART v2: Victorian ether flyers, seen from above =====================
// Every ship points along +x. Units match the old art (a sloop is ~34 long); battle scale multiplies.
// Looks are drawn from 1880s warships and steamers: black hulls, white upper works, buff funnels,
// teak decks, turrets and barbettes, boats in davits, cowl ventilators, plus ether vanes and a stern ether screw.

const LIVERY = {
  player:  { hull: "#1d1a17", band: "#e9e1cc", deck: "#b98c55", works: "#e6dcc3", funnel: "#c9a86a", fband: "#1d1a17", vane: "#efe2c4", spar: "#c9a14a", trim: "#e0bd6a" },
  navy:    { hull: "#1b1d20", band: "#e3e3df", deck: "#a98a5c", works: "#dcdcd6", funnel: "#c2a470", fband: "#1b1d20", vane: "#dcd8cc", spar: "#9a9a96", trim: "#c9c9c3" },
  merchant:{ hull: "#3b3f44", band: "#c9c3b4", deck: "#9c7a50", works: "#d8cfbb", funnel: "#2a2a2a", fband: "#b33a2a", vane: "#cfc6b2", spar: "#8a7a5a", trim: "#b8ad92" },
  pirate:  { hull: "#2a2622", band: "#5a4a3a", deck: "#6e5638", works: "#7b6a52", funnel: "#3a3330", fband: "#7a2a22", vane: "#9a8a72", spar: "#5a4a32", trim: "#8a7552" },
  mars:    { hull: "#7a3f1e", band: "#e0b45a", deck: "#c08a4e", works: "#d9a85a", funnel: "#7a3f1e", fband: "#e0b45a", vane: "#e8c27a", spar: "#e0b45a", trim: "#f2d58a" }
};
function mixHex(a, b, f) { const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); const x = p(a), y = p(b); return "#" + x.map((v, i) => Math.round(v + (y[i] - v) * f).toString(16).padStart(2, "0")).join(""); }
function liveryFor(nat, role) {
  const base = liveryBase(nat, role);
  const nc = nat === "player" ? (typeof G !== "undefined" && G && G.nation ? NATIONS[G.nation].col : "#d4513f") : (NATIONS[nat] ? NATIONS[nat].col : "#888888");
  // each nation's canvas carries a wash of its colour, edged in it, so you can tell ships apart in battle
  return Object.assign({}, base, { nation: nc, vane: mixHex(base.vane, nc, nat === "player" ? 0.12 : 0.32), fband: nat === "player" || role === "merchant" || nat === "pirate" || nat === "mars" ? base.fband : mixHex(nc, "#000000", 0.15) });
}
function liveryBase(nat, role) {
  if (nat === "player") return LIVERY.player;
  if (nat === "mars") return LIVERY.mars;
  if (nat === "pirate" || role === "pirate") return LIVERY.pirate;
  return role === "merchant" ? LIVERY.merchant : LIVERY.navy;
}
// Outline of each hull, bow at +x. [length/2 at stern, length/2 at bow, half-beam]
const HULLS = {
  sloop:   { st: -17, bow: 18, beam: 4.6, fine: 0.55 },
  gunboat: { st: -15, bow: 15, beam: 6.0, fine: 0.40 },
  kite:    { st: -17, bow: 19, beam: 5.4, fine: 0.62 },
  cruiser: { st: -18, bow: 19, beam: 5.0, fine: 0.50 },
  frigate: { st: -18, bow: 18, beam: 6.2, fine: 0.45 }
};
function hullPath(c, H, inset) {
  const b = H.beam - inset, st = H.st + inset * 0.8, bow = H.bow - inset * 1.4, mid = st + (bow - st) * H.fine;
  c.beginPath();
  c.moveTo(bow, 0);
  c.bezierCurveTo(bow - 2, -b * 0.55, mid + 3, -b, mid, -b);
  c.lineTo(st + 3, -b * 0.96);
  c.quadraticCurveTo(st, -b * 0.9, st, -b * 0.45);
  c.lineTo(st, b * 0.45);
  c.quadraticCurveTo(st, b * 0.9, st + 3, b * 0.96);
  c.lineTo(mid, b);
  c.bezierCurveTo(mid + 3, b, bow - 2, b * 0.55, bow, 0);
  c.closePath();
}
// --- small fittings ---
function funnel(c, x, y, r, L, t) {

  g.addColorStop(0, shade(L.funnel, 0.3)); g.addColorStop(1, shade(L.funnel, -0.35));
  c.fillStyle = g; c.beginPath(); c.ellipse(x, y, r, r * 0.92, 0, 0, TAU); c.fill();
  c.strokeStyle = L.fband; c.lineWidth = r * 0.35; c.beginPath(); c.ellipse(x, y, r * 0.82, r * 0.75, 0, 0, TAU); c.stroke();
  if (UPV && UPV.boiler >= 2) { c.strokeStyle = "#e0bd6a"; c.lineWidth = r * 0.12; c.beginPath(); c.ellipse(x, y, r * 0.97, r * 0.89, 0, 0, TAU); c.stroke(); }
  c.fillStyle = "#0b0a09"; c.beginPath(); c.ellipse(x, y, r * 0.55, r * 0.5, 0, 0, TAU); c.fill();
  const bl = UPV ? UPV.boiler : 0;
  c.fillStyle = `rgba(255,${120 + bl * 20 + (Math.sin(t / 90) * 40 | 0)},${40 + bl * 25},${0.35 + bl * 0.13})`; c.beginPath(); c.ellipse(x, y, r * (0.3 + bl * 0.04), r * (0.27 + bl * 0.04), 0, 0, TAU); c.fill();
}
function vent(c, x, y, r, ang, L) {

  c.fillStyle = "#151210"; c.beginPath(); c.arc(x + Math.cos(ang) * r * 0.35, y + Math.sin(ang) * r * 0.35, r * 0.55, 0, TAU); c.fill();
}
function mast(c, x, y, yard, L, furled) {
  c.strokeStyle = shade(L.funnel, -0.2); c.lineWidth = 0.5; c.beginPath(); c.moveTo(x, -yard); c.lineTo(x, yard); c.stroke();
  if (furled) { c.strokeStyle = "#d8cfb8"; c.lineWidth = 0.9; c.beginPath(); c.moveTo(x + 0.4, -yard * 0.9); c.lineTo(x + 0.4, yard * 0.9); c.stroke(); }

  c.fillStyle = g; c.beginPath(); c.arc(x, y, 0.9, 0, TAU); c.fill();

function turret(c, x, y, r, dir, guns, L) {

  c.strokeStyle = gl >= 3 ? "#9a7330" : "#2b2d30"; c.lineWidth = r * (0.28 + gl * 0.02); c.lineCap = "round";
  for (let i = 0; i < guns; i++) { const off = (i - (guns - 1) / 2) * r * 0.45; c.beginPath(); c.moveTo(x, y + off); c.lineTo(x + dir * r * (2.1 + gl * 0.2), y + off); c.stroke(); }
  c.lineCap = "butt";

  const g = c.createRadialGradient(x - r * 0.4, y - r * 0.45, r * 0.1, x, y, r);
  g.addColorStop(0, "#9aa0a6"); g.addColorStop(0.6, "#5b6066"); g.addColorStop(1, "#33363a");
  c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill();
  c.strokeStyle = "rgba(255,255,255,.18)"; c.lineWidth = 0.25; c.beginPath(); c.arc(x, y, r * 0.7, Math.PI * 1.1, Math.PI * 1.8); c.stroke();
  c.fillStyle = "#2b2d30"; c.beginPath(); c.arc(x - dir * r * 0.35, y, r * 0.22, 0, TAU); c.fill();
}
function boat(c, x, y, len, L) {

  c.beginPath(); c.ellipse(x, y, len / 2, len * 0.17, 0, 0, TAU); c.fill(); c.stroke();

function house(c, x, y, w, h, L, glass) {

  const g = c.createLinearGradient(x, y - h / 2, x, y + h / 2); g.addColorStop(0, shade(L.works, 0.15)); g.addColorStop(1, shade(L.works, -0.2));

  if (glass) { c.fillStyle = "rgba(150,190,210,.7)"; for (let i = 0; i < glass; i++) c.fillRect(x - w / 2 + 0.5 + i * (w - 1) / glass, y - 0.35, (w - 1) / glass - 0.3, 0.7); }

// --- ether vanes: brass-framed canvas wings, torn when damaged ---
function vanes(c, H, L, vf, small, t, kind) {
  const sl = UPV ? UPV.sails : 0;
  const root = H.beam * 0.95, reach = H.beam + 6.2 * (1 + sl * 0.07) * (0.35 + 0.65 * vf), x0 = H.st * 0.25, chord = (H.bow - H.st) * 0.30;
  for (const sd of [-1, 1]) {
    const lead = x0 + chord * 0.55, trail = x0 - chord * 0.45;
    c.beginPath();
    c.moveTo(lead, sd * root); c.quadraticCurveTo(lead - 1, sd * (root + reach * 0.6), lead - chord * 0.35, sd * reach);
    c.lineTo(trail - chord * 0.15, sd * (reach - 0.8)); c.quadraticCurveTo(trail - 0.5, sd * (root + reach * 0.3), trail, sd * root); c.closePath();
    const g = c.createLinearGradient(lead, 0, trail, 0); g.addColorStop(0, shade(L.vane, 0.15)); g.addColorStop(1, shade(L.vane, -0.25));
    c.fillStyle = g; c.globalAlpha = kind === "mars" ? 0.85 : 0.92; c.fill(); c.globalAlpha = 1;
    if (sl >= 4 && !small) { c.fillStyle = `rgba(242,213,138,${0.18 + Math.sin(t / 260) * 0.06})`; c.fill(); }
    if (!small) {
      c.strokeStyle = sl >= 2 ? "#e8c873" : L.spar; c.lineWidth = 0.45 + (sl >= 2 ? 0.15 : 0); c.stroke();
      c.lineWidth = 0.28; c.strokeStyle = shade(L.spar, -0.1);
      const ribs = 4 + (sl >= 1 ? 2 : 0) + (sl >= 3 ? 2 : 0);
      for (let k = 0; k <= ribs; k++) { const f = k / ribs, rx = lead + (trail - lead) * f, tx = lead - chord * 0.35 + (trail - chord * 0.15 - (lead - chord * 0.35)) * f; c.beginPath(); c.moveTo(rx, sd * root); c.lineTo(tx, sd * (reach - 0.4 * f)); c.stroke(); }
      c.strokeStyle = L.nation; c.lineWidth = 0.7; c.beginPath(); c.moveTo(lead - chord * 0.35, sd * reach); c.lineTo(trail - chord * 0.15, sd * (reach - 0.8)); c.stroke();
      if (vf < 0.6) { c.fillStyle = "#0e131b"; c.beginPath(); c.moveTo(x0, sd * (root + reach * 0.35)); c.lineTo(x0 + 1.4, sd * (root + reach * 0.5)); c.lineTo(x0 - 0.8, sd * (root + reach * 0.62)); c.closePath(); c.fill(); }
      if (vf < 0.3) { c.fillStyle = "#0e131b"; c.beginPath(); c.arc(x0 - 2, sd * (root + reach * 0.75), 0.9, 0, TAU); c.fill(); }
    } else { c.strokeStyle = "rgba(0,0,0,.45)"; c.lineWidth = 0.6; c.stroke(); }
  }
}
function etherScrew(c, H, L, t, still) {
  const x = H.st - 1.6, r = H.beam * 1.05, a = t / (still ? 500 : 70);
  c.fillStyle = "rgba(239,226,196,.12)"; c.beginPath(); c.ellipse(x, 0, r * 0.28, r, 0, 0, TAU); c.fill();
  c.strokeStyle = shade(L.spar, 0.1); c.lineWidth = 0.6;
  for (let k = 0; k < 4; k++) { const b = a + k * TAU / 4; c.beginPath(); c.moveTo(x, 0); c.lineTo(x + Math.cos(b) * 0.9, Math.sin(b) * r); c.stroke(); }
  c.fillStyle = L.spar; c.beginPath(); c.arc(x, 0, 0.55, 0, TAU); c.fill();
}

// --- the whole ship ---

function drawShip2(c, x, y, h, s, type, nat, role, t, small, st) {
  UPV = (st && st.up) || null;
  const L = liveryFor(nat, role), H = HULLS[type] || HULLS.sloop, flagCol = nat === "player" ? NATIONS[G.nation].col : (NATIONS[nat] ? NATIONS[nat].col : "#888");
  const vf = st ? clamp(st.vanes / st.d.vanes, 0, 1) : 1, hf = st ? clamp(st.hull / st.d.hull, 0, 1) : 1;
  const kind = nat === "mars" ? "mars" : "";

  c.save(); c.translate(x + s * 2.2, y + s * 3); c.rotate(h); c.scale(s, s);
  c.fillStyle = "rgba(0,0,0,.28)"; hullPath(c, H, -0.2); c.fill();
  c.restore();
  c.save(); c.translate(x, y); c.rotate(h); c.scale(s, s);
  vanes(c, H, L, vf, small, t, kind);
  etherScrew(c, H, L, t, st && st.sail === 0);
  // hull: dark sides with a rounded sheen, a painted band, then the deck
  const g = c.createLinearGradient(0, -H.beam, 0, H.beam); g.addColorStop(0, shade(L.hull, -0.3)); g.addColorStop(0.5, shade(L.hull, 0.35)); g.addColorStop(1, shade(L.hull, -0.4));
  c.fillStyle = g; hullPath(c, H, 0); c.fill();
  c.strokeStyle = nat === "player" ? L.trim : "rgba(0,0,0,.6)"; c.lineWidth = small ? 0.9 : 0.35; c.stroke();
  if (small) { c.fillStyle = L.deck; hullPath(c, H, 1.2); c.fill(); funnel(c, 1, 0, 1.6, L, t); c.fillStyle = flagCol; c.fillRect(H.st - 2.5, -1.2, 2.2, -2); c.restore(); return; }
  if (UPV && UPV.hull) {  // armour: iron scantlings up to a steel belt
    c.strokeStyle = UPV.hull >= 4 ? "#9aa3ab" : "#6f757b"; c.lineWidth = 0.22 + UPV.hull * 0.2; hullPath(c, H, 0.12 + UPV.hull * 0.1); c.stroke();
    if (UPV.hull >= 3) { c.fillStyle = "#c9c9c3"; c.save(); hullPath(c, H, 0.3); c.clip(); for (let xx = H.st + 2; xx < H.bow - 3; xx += 1.6) for (const sd of [-1, 1]) { c.beginPath(); c.arc(xx, sd * (H.beam - 0.42), 0.12, 0, TAU); c.fill(); } c.restore(); }
  }
  c.strokeStyle = L.band; c.lineWidth = 0.2; hullPath(c, H, 0.75); c.stroke();
  const dg = c.createLinearGradient(0, -H.beam, 0, H.beam); dg.addColorStop(0, shade(L.deck, -0.15)); dg.addColorStop(0.5, shade(L.deck, 0.12)); dg.addColorStop(1, shade(L.deck, -0.2));
  c.fillStyle = dg; hullPath(c, H, 1.35); c.fill();
  // teak planking with staggered butts
  c.save(); hullPath(c, H, 1.35); c.clip();
  c.strokeStyle = "rgba(60,35,15,.28)"; c.lineWidth = 0.12;
  for (let yy = -H.beam; yy <= H.beam; yy += 0.75) { c.beginPath(); c.moveTo(H.st, yy); c.lineTo(H.bow, yy); c.stroke(); }
  c.strokeStyle = "rgba(60,35,15,.18)";
  for (let yy = -H.beam, row = 0; yy <= H.beam; yy += 0.75, row++) for (let xx = H.st + (row % 3) * 2.2; xx < H.bow; xx += 6.6) { c.beginPath(); c.moveTo(xx, yy); c.lineTo(xx, yy + 0.75); c.stroke(); }
  c.restore();
  // bow: anchors and a steel ram plate
  c.fillStyle = "#7f858c"; c.beginPath(); c.moveTo(H.bow, 0); c.lineTo(H.bow - 3, -1.3); c.lineTo(H.bow - 3, 1.3); c.closePath(); c.fill();
  c.fillStyle = "#2a2a2a"; c.beginPath(); c.arc(H.bow - 4.2, -H.beam * 0.55, 0.35, 0, TAU); c.arc(H.bow - 4.2, H.beam * 0.55, 0.35, 0, TAU); c.fill();
  // fittings by type
  if (type === "sloop") {
    house(c, -9.5, 0, 5, 3.4, L, 3); funnel(c, 1, 0, 1.7, L, t);
    if (UPV && UPV.guns) for (const sd of [-1, 1]) for (const gx of [-1, 4]) { c.fillStyle = UPV.guns >= 3 ? "#9a7330" : "#33363a"; c.fillRect(gx - 0.55, sd * 2.7 - 0.45, 1.1, 0.9); c.strokeStyle = c.fillStyle; c.lineWidth = 0.35; c.beginPath(); c.moveTo(gx, sd * 3.0); c.lineTo(gx, sd * (3.9 + UPV.guns * 0.2)); c.stroke(); } mast(c, 7, 0, 3.3, L, true); mast(c, -4, 0, 2.8, L, true);
    vent(c, -2, -1.8, 0.6, -0.6, L); vent(c, -2, 1.8, 0.6, 0.6, L); boat(c, -6, -3.3, 3.4, L);
  } else if (type === "gunboat") {
    turret(c, 8.5, 0, 2.2, 1, 1, L); house(c, -1, 0, 4.4, 4.6, L, 3); funnel(c, -4.8, 0, 2.0, L, t); mast(c, 3.2, 0, 4, L, false);
    vent(c, -8, -2.4, 0.7, -0.5, L); vent(c, -8, 2.4, 0.7, 0.5, L); turret(c, -11.5, 0, 1.4, -1, 1, L);
  } else if (type === "kite") {
    // Martian: no funnel; an apergy lantern amidships and kite sails above
    c.fillStyle = "rgba(224,180,90,.25)"; c.beginPath(); c.arc(0, 0, 2.6, 0, TAU); c.fill();
    c.fillStyle = "#f2d58a"; c.beginPath(); c.arc(0, 0, 1.1 + Math.sin(t / 300) * 0.15, 0, TAU); c.fill();

      c.strokeStyle = L.trim; c.lineWidth = 0.2; c.stroke(); c.beginPath(); c.moveTo(kx - ks * 0.35, ky - ks); c.lineTo(kx - ks * 0.35, ky + ks); c.stroke(); });

    funnel(c, 0.8, 0, 2.1, L, t); funnel(c, -2.6, 0, 2.1, L, t); mast(c, 5.9, 0, 4.2, L, false); mast(c, -7.4, 0, 3.8, L, false);
    for (const sd of [-1, 1]) { boat(c, -0.8, sd * 4.5, 3.6, L); boat(c, 3.2, sd * 4.5, 2.8, L); vent(c, -8.4, sd * 2.6, 0.75, sd * 0.6, L); vent(c, 7.5, sd * 3.0, 0.7, sd * 0.6, L); }

  }

  c.fillStyle = flagCol; c.beginPath(); c.moveTo(H.st - 0.4, -0.3); c.lineTo(H.st - 5.2, -0.3 + w); c.lineTo(H.st - 5.2, -3.6 + w); c.lineTo(H.st - 0.4, -3.6); c.closePath(); c.fill();

const YARD_NAME = { capital: "the home capitals", colony: "colony yards", city: "Martian yards", free: "Ceres Haven", haven: "pirate havens", station: "Hermes Station" };
const noUps = () => ({ sails: 0, guns: 0, hull: 0, boiler: 0 });

// A ship's figures with its upgrades fitted
function upgradedDef(ship) {
  const b = SHIPS[ship.type], u = ship.up || noUps();
  return Object.assign({}, b, {
    hull: Math.round(b.hull * UPG.hull.hull[u.hull]),
    vanes: Math.round(b.vanes * UPG.sails.vanes[u.sails]),
    spd: b.spd * UPG.sails.spd[u.sails],
    ww: Math.min(0.85, b.ww + UPG.sails.ww[u.sails]),
    rangeMult: UPG.guns.range[u.guns], reloadMult: UPG.guns.reload[u.guns], dmgMult: UPG.guns.dmg[u.guns],
    coalMult: UPG.boiler.coal[u.boiler], steamMult: UPG.boiler.steam[u.boiler], up: u
  });
}
const upgCost = (k, l) => Math.round(UPG[k].base * l * l / 2 * SHIPS[G.ship.type].size * (1 - 0.06 * G.rank) / 10) * 10;
function whereSold(k, l) { return Object.keys(YARD).filter(y => YARD[y][k] >= l).map(y => YARD_NAME[y]).join(", "); }
const pips = l => "■".repeat(l) + "□".repeat(UPG_MAX - l);

function upgradesHtml(p) {
  const u = G.ship.up, yard = YARD[p.kind] || YARD.colony;
  return `<h3 style="font:20px var(--display);color:var(--brass-hi);margin:18px 0 4px">Upgrades</h3>
    <p class="note" style="margin-top:0">Hover or press and hold an upgrade to see it on your ship. Upgrades stay with the ship: they're left behind if you change ships, though they add to her trade-in value.</p>
    <div style="display:grid;gap:8px">${Object.keys(UPG).map(k => {
      const U = UPG[k], l = u[k], max = l >= UPG_MAX, next = l + 1, here = !max && yard[k] >= next, cost = max ? 0 : upgCost(k, next);
      const btn = max ? `<span class="note">Fully fitted</span>` : here ? `<button class="b sm ${G.gold >= cost ? "main" : ""}" data-upg="${k}" ${G.gold >= cost ? "" : 'aria-disabled="true"'}>${fmtGold(cost)}</button>` : `<span class="note" style="text-align:right">Not fitted here</span>`;
      return `<div class="card upg" data-upk="${k}"><div class="row" style="justify-content:space-between;flex-wrap:nowrap;align-items:flex-start;gap:10px">
        <div style="min-width:0"><b style="color:var(--parch)">${U.n}</b> <span class="pips">${pips(l)}</span>
          <div class="note">Now: ${l ? U.lv[l] + ". " : ""}${U.d(l)}.</div>
          ${max ? "" : `<div class="note">Next: <span style="color:var(--fg-2)">${U.lv[next]}</span>. ${U.d(next)}.${here ? "" : ` Fitted at ${whereSold(k, next)}.`}</div>`}</div>
        <div style="flex:none">${btn}</div></div></div>`;
    }).join("")}</div>`;
}
function wireUpgrades(p) {
  const root = $("portBody"), pic = root.querySelector('canvas.shippic[data-mine]');
  root.querySelectorAll("[data-upg]").forEach(b => b.onclick = () => {
    const k = b.dataset.upg, s = G.ship, l = s.up[k] + 1, cost = upgCost(k, l);
    if (G.gold < cost) { toast("You can't afford that yet."); return; }
    const before = shipDef(); G.gold -= cost; s.up[k] = l; s.upSpent = (s.upSpent || 0) + cost; const after = shipDef();
    s.hull += after.hull - before.hull; s.vanes += after.vanes - before.vanes;
    logMsg(`Fitted ${UPG[k].lv[l].toLowerCase()} at ${p.name}.`); toast(`${UPG[k].lv[l]} fitted.`); save(); openPort(p.id, "wright");
  });

  root.querySelectorAll(".card.upg").forEach(card => {
    const k = card.dataset.upk; if (G.ship.up[k] >= UPG_MAX) return;
    const show = () => { pic.dataset.preview = k; paintShipPics(root, true); };
    const hide = () => { delete pic.dataset.preview; paintShipPics(root, true); };
    card.addEventListener("mouseenter", show); card.addEventListener("mouseleave", hide);
    card.addEventListener("touchstart", show, { passive: true }); card.addEventListener("touchend", hide);
  });
}

// ===================== FLEETS (0.29) =====================
// As in Pirates!: prizes can sail with you. Only the flagship fights; the fleet adds hold space and berths,
// and sails at the pace of its slowest ship. A crew must be spread across every ship, so each needs a prize crew.
const FLEET_MAX = 8; // flagship included
const prizeCrew = t => Math.ceil(SHIPS[t].crew * 0.15);
const fleetList = () => G.fleet || [];
const fleetSize = () => 1 + fleetList().length;
const fleetCrewNeed = extra => [G.ship.type, ...fleetList().map(f => f.type), ...(extra ? [extra] : [])].reduce((n, t) => n + prizeCrew(t), 0);
function fleetMinOf(key) { return Math.min(...[G.ship.type, ...fleetList().map(f => f.type)].map(t => key === "spd" ? upgradedDef(t === G.ship.type ? G.ship : { type: t }).spd : SHIPS[t][key])); }
// The pace and windward ability of the whole fleet: the slowest ship sets both.
function fleetPace() {
  const d = upgradedDef(G.ship); if (!fleetList().length) return { spd: d.spd, ww: d.ww, size: d.size };
  let spd = d.spd, ww = d.ww, size = d.size;
  for (const f of fleetList()) { const x = upgradedDef(f); spd = Math.min(spd, x.spd); ww = Math.min(ww, x.ww); size += x.size; }
  return { spd, ww, size };
}
// Swap the flagship with a fleet ship (names travel with their ships).
function swapFlag(i) {
  const f = G.fleet[i], s = G.ship;
  const old = { type: s.type, name: G.shipName, hull: s.hull, vanes: s.vanes, up: s.up, upSpent: s.upSpent || 0 };
  s.type = f.type; s.hull = f.hull; s.vanes = f.vanes; s.up = f.up || noUps(); s.upSpent = f.upSpent || 0; G.shipName = f.name;
  G.fleet[i] = old;
  logMsg(`Moved your flag to the ${G.shipName}.`);
}
function addToFleet(a, damaged) {
  const x = SHIPS[a.type];
  G.fleet.push({ type: a.type, name: a.name, hull: Math.max(x.hull * 0.35, a.hull), vanes: Math.max(x.vanes * 0.3, a.vanes), up: noUps(), upSpent: 0 });
}
const fleetSaleValue = f => { const x = upgradedDef(f); return Math.round(SHIPS[f.type].price * 0.45 * (0.5 + 0.5 * f.hull / x.hull) + 0.4 * (f.upSpent || 0)); };
function fleetRepairCost() { return fleetList().reduce((n, f) => { const x = upgradedDef(f); return n + Math.round(((x.hull - f.hull) * 4 + (x.vanes - f.vanes) * 3) * (1 - G.rank * 0.08)); }, 0); }
function repairFleet(frac) { for (const f of fleetList()) { const x = upgradedDef(f); f.hull += (x.hull - f.hull) * frac; f.vanes += (x.vanes - f.vanes) * frac; } }
// Too few hands to man every ship? The weakest ships are cast adrift.
function checkFleetCrew() {
  const lost = [];
  while (fleetList().length && G.ship.crew < fleetCrewNeed()) {
    let wi = 0; G.fleet.forEach((f, i) => { if (SHIPS[f.type].price < SHIPS[G.fleet[wi].type].price) wi = i; });
    lost.push(G.fleet.splice(wi, 1)[0].name);
  }
  if (lost.length) { logMsg(`Too few hands to man the fleet: set the ${lost.join(" and the ")} adrift.`); toast(`Too few hands to man every ship. The ${lost.join(" and the ")} ${lost.length > 1 ? "were" : "was"} set adrift.`, 5000); }
}

// ---------- the fleet on the chart: ships follow in the flagship's wake ----------
function drawFleetOnChart(c, t, z) {
  const fl = fleetList(); if (!fl.length) return;
  const gap = 5;
  fl.forEach((f, i) => {
    let px, py, ph;
    const k = wake.length - 1 - (i + 1) * gap;
    if (k >= 1) { const a = wake[k], b = wake[k + 1] || { x: G.ship.x, y: G.ship.y }; px = a.x; py = a.y; ph = Math.atan2(b.y - a.y, b.x - a.x); }
    else { const back = 14 * (i + 1) * WORLD; px = G.ship.x - Math.cos(G.ship.h) * back; py = G.ship.y - Math.sin(G.ship.h) * back; ph = G.ship.h; }
    const [sx, sy] = toS(px, py), sc = Math.max(0.5, z * 0.62) * SHIPS[f.type].size;
    drawShip2(c, sx, sy, ph, sc, f.type, "player", "", t, true, null);
  });
}

// ---------- the Fleet screen ----------
function fleetScreen(back) {

    return `<div class="card"><canvas class="shippic" data-ship="${f.type}" ${flag ? 'data-mine="1"' : `data-fleet="${i}"`} aria-label="The ${esc(flag ? G.shipName : f.name)}"></canvas>
      <h3>The ${esc(flag ? G.shipName : f.name)}</h3><div class="note">${SHIPS[f.type].n} · ${SHIPS[f.type].guns} guns · hold ${SHIPS[f.type].cargo} · berths ${SHIPS[f.type].crew}</div>
      <div class="note num">Hull ${Math.round(f.hull)}/${x.hull} · vanes ${Math.round(f.vanes)}/${x.vanes} · ${Object.keys(UPG).map(k => `${UPG[k].n} ${pips((f.up || noUps())[k])}`).join(" · ")}</div>
      <div class="row" style="margin-top:8px;gap:6px">${acts}</div></div>`;
  };

  showPanel(`
    <header><div><h2 id="pTitle">Your fleet</h2><div class="tag">${fleetSize()} of ${FLEET_MAX} ships · only the flagship fights</div></div>
      <div class="tag num">Crew ${s.crew}/${d.crew} (at least ${fleetCrewNeed()} to man every ship) · hold ${Math.floor(cargoUsed())}/${d.cargo}</div></header>
    <div class="body">
      ${fleetList().length ? `<p class="note" style="margin-top:0">The fleet sails at the pace of its slowest ship (${Math.round(pace.spd / upgradedDef(G.ship).spd * 100)}% of your flagship's speed). Repairs at a shipwright cover every ship.</p>` : `<p class="note" style="margin-top:0">Capture a ship and you can add her to your fleet. She brings her hold and her berths, though she slows you to her pace.</p>`}
      <div class="grid2">${row(G.ship, -1)}${fleetList().map(row).join("")}</div>
    </div>
    <footer><button class="b main" id="flBack" autofocus>Back</button></footer>`, e => { if (e.key === "Escape") $("flBack").click(); });
  paintShipPics(panel);
  const again = () => fleetScreen(back);
  panel.querySelectorAll("[data-flag]").forEach(b => b.onclick = () => { swapFlag(+b.dataset.flag); toast(`Your flag now flies from the ${G.shipName}.`); save(); again(); });
  panel.querySelectorAll("[data-sell]").forEach(b => b.onclick = () => { const i = +b.dataset.sell, f = G.fleet[i], v = fleetSaleValue(f); G.gold += v; G.fleet.splice(i, 1); trimCargo(); logMsg(`Sold the ${f.name} for ${fmtGold(v)}.`); toast(`Sold the ${f.name} for ${fmtGold(v)}.`); save(); again(); });
  panel.querySelectorAll("[data-adrift]").forEach(b => b.onclick = () => { const i = +b.dataset.adrift, f = G.fleet[i]; G.fleet.splice(i, 1); trimCargo(); logMsg(`Set the ${f.name} adrift.`); toast(`The ${f.name} drifts away astern.`); again(); });
  $("flBack").onclick = () => { if (back) back(); else { closePanel(); mode = prevMode === "port" ? "port" : "map"; resumeMap(); } };
}
// A smaller fleet holds less: anything over the new hold goes over the side.
function trimCargo() {
  let over = cargoUsed() - shipDef().cargo; if (over <= 0) return;
  for (const k of Object.keys(G.cargo).sort((a, b) => GOODS[a].b - GOODS[b].b)) { const take = Math.min(G.cargo[k], over); addCargo(k, -take); over -= take; if (over <= 0) break; }
  toast("The hold was over-full, so the cheapest cargo went over the side.", 3500);
}

// ===================== THE HELIOGRAPH NETWORK (0.30) =====================
// First part of network play: captains on the same "circuit" see each other's ships on their charts,
// meet in the aether, and exchange signals. One captain opens a circuit and shares its code; up to three join.
// Browsers talk directly to each other (WebRTC through the PeerJS library); the opener relays for the rest.
// Every game keeps its own calendar, so a ship is placed by where she is relative to the nearest world.
const NET = { state: "off", code: "", me: "", host: false, peers: new Map(), log: [], tr: null, err: "", lastSent: "", lastAt: 0, view: null, joinT: 0 };
const NET_MAX = 4, NET_PREFIX = "aetherforge-v1-";
const CODE_WORDS = ["BRASS", "STEAM", "COMET", "AETHER", "ORRERY", "CANAL", "LANTERN", "BOILER", "SEXTANT", "GALLEON", "PHAETON", "COPPER", "RIVET", "ZEPHYR"];
const newCode = () => pickOne(CODE_WORDS) + "-" + ri(100, 999);
const netOn = () => NET.state === "open";
const PEERJS_URLS = ["https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js", "https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"];

// ---------- transports ----------
function loadPeerJS() {
  return new Promise((res, rej) => {
    if (window.Peer) return res(); let i = 0;
    const next = () => { if (i >= PEERJS_URLS.length) return rej(new Error("load"));
      const s = document.createElement("script"); s.src = PEERJS_URLS[i++]; s.onload = () => window.Peer ? res() : next(); s.onerror = next; document.head.appendChild(s); };
    next();
  });
}
// Real network: a star around the captain who opened the circuit.
function peerTransport(cb) {
  let peer = null, hostConn = null, isHost = false, closed = false; const conns = new Map();
  const sendTo = (c, m) => { try { if (c && c.open) c.send(m); } catch (e) { } };
  const wire = conn => {
    conn.on("open", () => {
      if (!isHost) { hostConn = conn; return; }
      if (conns.size >= NET_MAX - 1) { sendTo(conn, { t: "full" }); setTimeout(() => { try { conn.close(); } catch (e) { } }, 400); return; }
      conns.set(conn.peer, conn); sendTo(conn, { t: "welcome", you: conn.peer });
    });
    conn.on("data", m => {
      if (!m || typeof m !== "object") return;
      if (isHost) { if (!conns.has(conn.peer)) return; m.f = conn.peer; for (const [id, c] of conns) if (id !== conn.peer) sendTo(c, m); cb.msg(m); }
      else if (m.t === "welcome") cb.open(String(m.you || ""));
      else if (m.t === "full") cb.error("full");
      else cb.msg(m);
    });
    conn.on("close", () => {
      if (isHost) { if (!conns.delete(conn.peer)) return; const m = { t: "bye", f: conn.peer }; for (const c of conns.values()) sendTo(c, m); cb.msg(m); }
      else if (!closed) cb.closed();
    });
    conn.on("error", () => { });
  };
  const fail = e => cb.error((e && e.type) || "error");
  return {
    async host(code) { await loadPeerJS(); isHost = true; peer = new Peer(NET_PREFIX + code.toLowerCase()); peer.on("open", () => cb.open("host")); peer.on("connection", wire); peer.on("error", fail);
      peer.on("disconnected", () => { if (!closed) { try { peer.reconnect(); } catch (e) { } } }); },
    async join(code) { await loadPeerJS(); peer = new Peer(); peer.on("open", () => wire(peer.connect(NET_PREFIX + code.toLowerCase(), { reliable: true }))); peer.on("error", fail); },
    send(m) { if (isHost) { m.f = "host"; for (const c of conns.values()) sendTo(c, m); } else sendTo(hostConn, m); },
    close() { closed = true; try { peer && peer.destroy(); } catch (e) { } }
  };
}
// Same-computer circuit between browser tabs (codes beginning LOCAL-); also used to test the game.
function localTransport(cb) {
  let ch = null, id = "", isHost = false;
  const start = code => { ch = new BroadcastChannel(NET_PREFIX + code.toLowerCase());
    ch.onmessage = e => { const m = e.data; if (!m || m.f === id) return;
      if (m.t === "knock") { if (isHost) ch.postMessage({ t: "welcome", f: "host", to: m.f }); return; }
      if (m.t === "welcome") { if (m.to === id && !isHost) cb.open(id); return; }
      cb.msg(m); }; };
  return {
    async host(code) { isHost = true; id = "host"; start(code); setTimeout(() => cb.open("host"), 0); },
    async join(code) { id = "g" + Math.random().toString(36).slice(2, 9); start(code); ch.postMessage({ t: "knock", f: id }); },
    send(m) { m.f = id; try { ch.postMessage(m); } catch (e) { } },
    close() { try { ch.postMessage({ t: "bye", f: id }); ch.close(); } catch (e) { } }
  };
}

// ---------- the circuit ----------
const NET_ERRORS = {
  "peer-unavailable": "No circuit with that code is open. Check the code, and that your friend has opened the circuit.",
  "unavailable-id": "That code is already in use. Open the circuit again for a new code.",
  full: "That circuit is full (four captains).", timeout: "No answer from that circuit. Check the code and try again.",
  load: "The network library couldn't be loaded. Check your internet connection.",
  network: "Lost touch with the signalling station. Check your internet connection.",
  "browser-incompatible": "This browser can't make the connection. Try a current version of Chrome, Edge, Firefox or Safari."
};
function netStart(kind, code, local) {
  netStop(true);
  NET.state = "connecting"; NET.err = ""; NET.host = kind === "host"; NET.code = String(code).toUpperCase().trim(); NET.peers.clear();
  const cb = {
    open: id => { clearTimeout(NET.joinT); NET.me = id; NET.state = "open"; netLog(null, NET.host ? `Circuit ${NET.code} is open.` : `Joined circuit ${NET.code}.`); netSendPresence(true); netRefresh(true); },
    msg: netOnMsg,
    error: type => { clearTimeout(NET.joinT); NET.err = NET_ERRORS[type] || "The circuit couldn't be raised. Try again in a moment.";
      if (NET.state !== "open" || type === "full" || type === "unavailable-id") { NET.state = "off"; if (NET.tr) NET.tr.close(); NET.tr = null; NET.peers.clear(); } netRefresh(true); },
    closed: () => { NET.state = "off"; NET.err = "The circuit was closed by the captain who opened it."; NET.tr = null; NET.peers.clear(); toast("The heliograph circuit has closed.", 4000); netRefresh(true); }
  };
  NET.tr = (local ? localTransport : peerTransport)(cb);
  NET.tr[kind](NET.code).catch(() => cb.error("load"));
  if (kind === "join") NET.joinT = setTimeout(() => { if (NET.state === "connecting") cb.error("timeout"); }, 15000);
}
function netStop(quiet) {
  clearTimeout(NET.joinT); if (NET.tr) { try { NET.tr.send({ t: "bye" }); } catch (e) { } NET.tr.close(); }
  NET.tr = null; NET.state = "off"; NET.peers.clear(); NET.lastSent = ""; if (!quiet) { NET.err = ""; netRefresh(true); }
}
function netLog(from, text, priv, mine) {
  const p = from ? NET.peers.get(from) : null;
  NET.log.push({ from, cap: mine ? "You" : p ? p.cap : from ? "A captain" : "", text, priv: !!priv, mine: !!mine, at: Date.now() });
  if (NET.log.length > 60) NET.log.shift();
}

// ---------- what we tell the others, and what we believe of what they tell us ----------
const NET_BODIES = () => [...PLANETS.map(p => p.id), ...Object.keys(MINOR)];
function netMyPresence() {
  if (!G || !G.ship) return null;
  const s = G.ship; let a = "sun", ax = 0, ay = 0, bd = 150 * WORLD;
  for (const id of NET_BODIES()) { const b = bodyPos(id, G.day), d = Math.hypot(s.x - b.x, s.y - b.y); if (d < bd) { bd = d; a = id; ax = s.x - b.x; ay = s.y - b.y; } }
  if (a === "sun") { ax = Math.hypot(s.x, s.y); ay = Math.atan2(s.y, s.x); }
  const st = mode === "title" ? "away" : mode === "battle" || mode === "dive" || mode === "duel" ? "battle" : G.docked ? "port:" + G.docked : "sea";
  return { cap: G.captain, rank: rankOf(), ship: G.shipName, type: s.type, nat: G.nation, fame: Math.floor(G.fame), fleet: fleetSize(), up: s.up,
    a, ax: Math.round(ax * 10) / 10, ay: a === "sun" ? Math.round(ay * 1000) / 1000 : Math.round(ay * 10) / 10, h: Math.round(s.h * 100) / 100, st, v: VERSION };
}
function netSendPresence(force) {
  if (!netOn() || !NET.tr) return; const p = netMyPresence(); if (!p) return;
  const j = JSON.stringify(p), now = Date.now();
  if (!force && (now - NET.lastAt < 300 || (j === NET.lastSent && now - NET.lastAt < 2500))) return;
  NET.lastSent = j; NET.lastAt = now; NET.tr.send({ t: "p", d: p });
}
// Everything from another captain is untrusted: keep only well-formed fields.
function netClean(d) {
  const str = (v, n) => String(v == null ? "" : v).replace(/[\u0000-\u001f\u007f]/g, "").slice(0, n), num = (v, lo, hi) => (typeof v === "number" && isFinite(v) ? clamp(v, lo, hi) : 0);
  const o = { cap: str(d.cap, 28) || "A captain", rank: str(d.rank, 40), ship: str(d.ship, 24) || "ship", type: SHIPS[d.type] ? d.type : "sloop", nat: GREAT.includes(d.nat) ? d.nat : "gb",
    fame: num(d.fame, 0, 99999), fleet: num(d.fleet, 1, FLEET_MAX), a: d.a === "sun" || NET_BODIES().includes(d.a) ? d.a : "sun",
    ax: num(d.ax, -EDGE * 2, EDGE * 2), ay: num(d.ay, -EDGE * 2, EDGE * 2), h: num(d.h, -100, 100), st: str(d.st, 24) || "sea", v: str(d.v, 8), up: noUps() };
  if (d.up && typeof d.up === "object") for (const k of Object.keys(o.up)) o.up[k] = Math.round(num(d.up[k], 0, UPG_MAX));
  return o;
}
function netOnMsg(m) {
  const id = String(m.f || ""); if (!id || id === NET.me) return;
  if (m.t === "p" && m.d && typeof m.d === "object") {
    let p = NET.peers.get(id); const fresh = !p; if (!p) { p = { id, x: null, y: null }; NET.peers.set(id, p); }
    Object.assign(p, netClean(m.d), { seen: Date.now() });
    if (fresh) { toast(`Heliograph: ${p.rank} ${p.cap} of the ${p.ship} is on the circuit.`, 4500); netLog(null, `${p.cap} of the ${p.ship} joined the circuit.`);
      if (p.v && p.v !== VERSION) netLog(null, `${p.cap} is playing version ${p.v}; you have ${VERSION}. Ships may not line up until you both update.`); netSendPresence(true); netRefresh(true); }
    else netRefresh(false);
  } else if (m.t === "hail" && m.d && typeof m.d === "object") {

const BRAWL = [["wind", "chop", 0.62], ["strike", "chop", 0.14], ["rec", "chop", 0.5], ["idle", null, 0.5], ["wind", "slash", 0.48], ["strike", "slash", 0.14], ["rec", "slash", 0.4], ["def", "parry", 0.45], ["idle", null, 0.6], ["def", "duck", 0.45]];

// ---------- rules ----------
function duelAdv() {

  if (ATK[act]) {
    const sw = mine ? D.sword.spd : 1, rip = F.rip > 0 ? 0.6 : 1;
    F.st = "wind"; F.kind = act; F.t = 0; F.dur = ATK[act].wind * rip / (duelSpeed(F) * sw); F.rip = 0;
    if (mine) duelFoeReacts(act, F.dur);

// The enemy captain sees your wind-up and may answer it, depending on skill and how slow the blow is.

// Draw one fencer. P is the pose from duelPose(); f = +1 faces right, -1 faces left.
function drawFencer2(c, x, gy, s, f, F, L, t, dim) {
  L = lookDetail(L);
  const P = duelPose(F, t);
  P.effort = F.st === "wind" || F.st === "strike";
  c.save(); c.translate(x, gy); c.scale(f * s, s);

  const toW = (px, py) => ({ x: hip.x + px * Math.cos(lw) - py * Math.sin(lw), y: hip.y + px * Math.sin(lw) + py * Math.cos(lw) });

  const hand = { x: shF.x + Math.cos(P.arm) * reach, y: shF.y - Math.sin(P.arm) * reach };
