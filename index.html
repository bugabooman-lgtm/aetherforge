  // ---- coat tails, swinging behind ----
  const sw = clamp(-P.lean * 6 + P.lunge * 8 + (F.st === "strike" ? 4 : 0) + P.lift * 0.15, -4, 14);
  blob(c, [hip.x - 6.5, hip.y - 3, hip.x + 1, hip.y - 1, hip.x - 4 - sw * 0.6, hip.y + 22 - crouch * 4, hip.x - 9 - sw, hip.y + 21 - crouch * 5 - sw * 0.3], coatD);
  leg(fl, ff, false);
  // ---- torso, drawn upright in its own frame and leaned ----
  c.save(); c.translate(hip.x, hip.y); c.rotate(lw);
  const tpath = () => { c.beginPath(); c.moveTo(-7, 3); c.quadraticCurveTo(-9.5, -12, -8, -24); c.quadraticCurveTo(-7, -30, -3, -31); c.lineTo(3.5, -31);
    c.quadraticCurveTo(9.5, -27, 8.8, -19); c.quadraticCurveTo(8, -9, 7, 3); c.closePath(); };
  c.fillStyle = coatD; tpath(); c.fill();
  c.save(); tpath(); c.clip();
  c.fillStyle = coat; c.beginPath(); c.ellipse(1.5, -16, 7.6, 17, 0, 0, TAU); c.fill();
  c.fillStyle = shade(coat, 0.14); c.beginPath(); c.ellipse(4.5, -21, 3, 8, 0.2, 0, TAU); c.fill();
  c.restore();
  // front skirt of the coat below the belt
  blob(c, [-6.5, 2, 7, 2, 6.2, 11 - crouch * 3, -1, 11 - crouch * 3], coatD);
  // shirt and cravat at the open collar, lapel edge, buttons
  blob(c, [0.6, -31, 4.4, -31, 5.6, -24, 3.2, -19, 1.6, -24], L.shirt);
  blob(c, [1.6, -29.5, 4.2, -29.5, 3.0, -26.5], shade(L.shirt, -0.12));
  c.strokeStyle = L.trim; c.lineWidth = 0.9; c.beginPath(); c.moveTo(4.6, -30.5); c.quadraticCurveTo(7.6, -24, 6.4, -2); c.stroke();
  c.fillStyle = L.buttons; for (let k = 0; k < 4; k++) { c.beginPath(); c.arc(4.6, -18 + k * 4.6, 0.7, 0, TAU); c.fill(); }
  // standing collar
  blob(c, [-3.4, -34, 1.2, -33.6, 1.6, -30.6, -3.4, -30.4], coat); c.fillStyle = L.trim; c.fillRect(-3.4, -34.4, 4.8, 0.9);
  // belt or sash
  blob(c, [-7.2, -1.2, 7.2, -1.2, 7.1, 1.8, -7.1, 1.8], L.sash || L.belt);
  if (L.sash) blob(c, [-6, 1, -3, 1, -5, 9, -7.5, 8], L.sash); else { c.fillStyle = "#c9a14a"; c.fillRect(2.6, -1, 2.6, 2.6); }
  if (L.epaulette) { c.fillStyle = L.trim; c.beginPath(); c.ellipse(-0.6, -29.2, 5, 1.8, 0, 0, TAU); c.fill(); c.fillStyle = shade(L.trim, -0.25); for (let k = -3; k <= 3; k += 1.5) c.fillRect(-0.6 + k, -28, 0.6, 2.4); }
  c.restore();
  // ---- head ----
  const tilt = lw * 0.5 + (F.st === "stun" ? -0.35 : 0) + (P.crouch > 0.5 ? 0.2 : 0);
  let hd = toW(0.6, -40);
  if (L.species === "Ossari") { // a long ringed neck rising from the collar
    const n0 = toW(-0.6, -32), n1 = toW(1.2, -45);
    limb(c, n0.x, n0.y, n1.x, n1.y, 2.6, 2.2, L.skin, true);
    c.strokeStyle = shade(L.skin, -0.4); c.lineWidth = 0.6;
    for (let k = 1; k < 5; k++) { const p = { x: mix(n0.x, n1.x, k / 5), y: mix(n0.y, n1.y, k / 5) }; c.beginPath(); c.moveTo(p.x - 2.4, p.y + 0.3); c.lineTo(p.x + 2.4, p.y - 0.3); c.stroke(); }
    hd = toW(2.2, -50); }
  else if (L.species === "Skarr") hd = toW(0.0, -40.5);
  c.save(); c.translate(hd.x, hd.y); c.scale(1.3, 1.3); drawHead(c, 0, 0, tilt, L, P); c.restore();
  // ---- sword arm and blade ----
  limb(c, shF.x, shF.y, sa.jx, sa.jy, 4.4, 3.6, coat, true);
  limb(c, sa.jx, sa.jy, sa.ex, sa.ey, 3.6, 3.0, coat, true);
  { const ca = Math.atan2(sa.ey - sa.jy, sa.ex - sa.jx); limb(c, sa.ex - Math.cos(ca) * 5.5, sa.ey - Math.sin(ca) * 5.5, sa.ex - Math.cos(ca) * 3.2, sa.ey - Math.sin(ca) * 3.2, 3.4, 3.4, L.trim, false); }
  c.fillStyle = L.shirt; c.beginPath(); c.arc(sa.ex - Math.cos(Math.atan2(sa.ey - sa.jy, sa.ex - sa.jx)) * 1.6, sa.ey - Math.sin(Math.atan2(sa.ey - sa.jy, sa.ex - sa.jx)) * 1.6, 2.7, 0, TAU); c.fill();
  // blade (drawn before the fist so the fingers wrap the grip)
  const tip = drawBlade(c, sa.ex, sa.ey, P.sword, L.blade, s);
  c.fillStyle = L.glove || L.skin; c.beginPath(); c.arc(sa.ex, sa.ey, 2.4, 0, TAU); c.fill();
  c.fillStyle = shade(L.glove || L.skin, -0.3); c.beginPath(); c.arc(sa.ex + 0.5, sa.ey + 0.8, 1.3, 0, TAU); c.fill();
  // motion smear on a strike
  if (F.st === "strike" && F.trail && F.trail.length > 1) {
    c.save(); c.globalCompositeOperation = "lighter";
    for (let i = 1; i < F.trail.length; i++) { const a = F.trail[i - 1], b = F.trail[i]; c.fillStyle = `rgba(220,230,240,${0.08 + i * 0.05})`; c.beginPath(); c.moveTo(sa.ex, sa.ey); c.lineTo(a.x, a.y); c.lineTo(b.x, b.y); c.closePath(); c.fill(); }
    c.restore();
  }
  if (dim) { c.globalCompositeOperation = "source-atop"; c.fillStyle = dim; c.fillRect(-60, -140, 140, 160); c.globalCompositeOperation = "source-over"; }
  c.restore();
  // remember where the tip was, for the smear (local coords)
  if (F.st === "strike") { F.trail = F.trail || []; F.trail.push({ x: tip.x, y: tip.y }); if (F.trail.length > 5) F.trail.shift(); } else F.trail = null;
  return { tx: x + f * tip.x * s, ty: gy + (tip.y - P.lift) * s };
}

// ===================== BACKUPS AND UPDATES (0.27) =====================
// Three layers, as in Starforge:
//  1. Snapshots: the last five saves kept in this browser, made every 10 game days and before risky steps.
//  2. Cloud backup: when played on claude.ai, a private copy in the player's own account,
//     which survives clearing browser data and follows them to other devices.
//  3. Backup files: save a copy of the voyage as a file, and load one back.
// Plus an updater for copies played outside claude.ai (a downloaded file or the GitHub Pages site).
const BKEY = "aetherforge-backups";
const UPD_DEFAULT = "https://bugabooman-lgtm.github.io/aetherforge/";
const CLOUD_EVERY = 120000; // ms between automatic cloud saves
const inViewer = () => typeof window.claude !== "undefined" && !!window.claude && typeof window.claude.use === "function";

const saveSummary = g => g && g.ship ? `${g.captain || "Captain"} of the ${g.shipName || "ship"}, ${dateStr(g.day || 0)}` : "no voyage";

// ---------- 1. snapshots ----------
function getBackups() { try { return JSON.parse(localStorage.getItem(BKEY) || "[]"); } catch (e) { return []; } }
function putBackups(list) { for (let n = list.length; n > 0; n--) { try { localStorage.setItem(BKEY, JSON.stringify(list.slice(0, n))); return; } catch (e) { } } }
function snapshotData(reason, data, g) {
  const list = getBackups(); if (list[0] && list[0].data === data) return;
  list.unshift({ at: Date.now(), reason, sum: saveSummary(g), day: g && g.day || 0, data });
  while (list.length > 5) list.pop(); putBackups(list);
}
function backupNow(reason) { if (G && G.ship) snapshotData(reason, JSON.stringify(G), G); }
function backupStored(reason) { try { const t = localStorage.getItem(SAVE_KEY); if (t) snapshotData(reason, t, JSON.parse(t)); } catch (e) { } }
function afterSave() {
  if (!G || !G.ship) return;
  const last = getBackups().find(b => b.reason === "auto");
  if (!last || (G.day || 0) - last.day >= 10 || (G.day || 0) < last.day) backupNow("auto");
  cloudSave(false);
}

// ---------- 2. cloud backup (claude.ai only) ----------
const CL = { db: null, uid: null, meta: null, last: 0, busy: false, err: "", ready: false };
async function cloudInit() {
  if (!inViewer()) return;
  try {
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const uid = await user.id(); if (!uid) return;
    CL.db = db; CL.uid = uid; CL.ready = true;
    const m = await cloudCol().doc("meta").get();
    CL.meta = m.exists ? m.data() : null;
  } catch (e) { CL.err = "unavailable"; }
  if (mode === "title") titleScreen();
}
const cloudCol = () => CL.db.collection("data/users/" + CL.uid);
async function cloudSave(force) {
  if (!CL.ready || CL.busy || !G || !G.ship) return;
  if (!force && Date.now() - CL.last < CLOUD_EVERY) return;
  CL.busy = true; CL.last = Date.now();
  try {
    const text = JSON.stringify(G), size = 180000, chunks = Math.ceil(text.length / size);
    for (let i = 0; i < chunks; i++) await cloudCol().doc("save-" + i).set({ d: text.slice(i * size, (i + 1) * size) });
    const meta = { at: Date.now(), day: G.day || 0, sum: saveSummary(G), gid: G.gid || "", chunks, v: VERSION };
    await cloudCol().doc("meta").set(meta); CL.meta = meta; CL.err = "";
  } catch (e) { CL.err = (e && e.code) || "unavailable"; }
  CL.busy = false;
}
async function cloudLoad() {
  const m = CL.meta; if (!CL.ready || !m) return null;
  let t = ""; for (let i = 0; i < m.chunks; i++) { const d = await cloudCol().doc("save-" + i).get(); if (!d.exists) return null; t += d.data().d; }
  return JSON.parse(t);
}
// Should the title screen offer the cloud copy?
function cloudOffer() {
  const m = CL.meta; if (!m) return null;
  let local = null; try { const t = localStorage.getItem(SAVE_KEY); if (t) local = JSON.parse(t); } catch (e) { }
  if (!local) return m;
  if (local.gid && m.gid === local.gid && (local.day || 0) >= m.day) return null;
  if (local.gid && m.gid === local.gid && (local.day || 0) < m.day) return m;
  return m.gid !== local.gid ? m : null;
}
async function restoreCloud(back) {
  try { const g = await cloudLoad(); if (!g || !g.ship) { toast("The cloud backup couldn't be read."); return; }
    backupStored("restore"); G = g; ensureV2(); save(); toast("Cloud backup restored."); startVoyage(); }
  catch (e) { toast("The cloud backup couldn't be read."); if (back) back(); }
}

// ---------- 3. backup files ----------
async function saveBackupFile() {
  if (!G || !G.ship) { toast("Start or continue a voyage first."); return; }
  const name = `aetherforge-backup-${Math.floor(G.day)}.json`, data = JSON.stringify(G);
  if (inViewer()) {
    try { const dl = await window.claude.use("downloads"); if (!dl) { toast("Saving files isn't available here."); return; }
      await dl.save({ filename: name, data }); toast("Backup file saved."); }
    catch (e) { if (e && e.code !== "declined") toast("The backup file couldn't be saved."); }
    return;
  }
  try { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], { type: "application/json" })); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000); toast("Backup file downloaded."); }
  catch (e) { toast("The backup file couldn't be saved."); }
}
function loadBackupFile(back) {
  const inp = document.createElement("input"); inp.type = "file"; inp.accept = ".json,application/json,text/plain";
  inp.onchange = () => { const f = inp.files[0]; if (!f) return;
    f.text().then(t => { let g; try { g = JSON.parse(t); } catch (e) { toast("That file isn't an Aetherforge save."); return; }
      if (!g || !g.ship || !g.captain) { toast("That file isn't an Aetherforge save."); return; }
      confirmLoad(`Load ${esc(saveSummary(g))}?`, g, back); }); };
  inp.click();
}
function confirmLoad(question, g, back) {
  const cur = hasSave() ? (() => { try { return saveSummary(JSON.parse(localStorage.getItem(SAVE_KEY))); } catch (e) { return "your current voyage"; } })() : null;
  showPanel(`<header><h2 id="pTitle">Load this voyage?</h2></header>
    <div class="body"><div class="prose"><p>${question}</p>${cur ? `<p class="note">Your current voyage (${esc(cur)}) is kept as a snapshot first, so you can switch back.</p>` : ""}</div></div>
    <footer><button class="b" id="lcNo" autofocus>Cancel</button><button class="b main" id="lcYes">Load it</button></footer>`, e => { if (e.key === "Escape") $("lcNo").click(); });
  $("lcNo").onclick = back;
  $("lcYes").onclick = () => { backupStored("restore"); G = g; ensureV2(); save(); gamePaused = false; menuFrom = null; B = null; toast("Voyage loaded."); startVoyage(); };
}

// ---------- updater (copies played outside claude.ai) ----------
const UPD = { state: "", info: null };
const verCmp = (a, b) => { const x = String(a).split(".").map(Number), y = String(b).split(".").map(Number); for (let i = 0; i < Math.max(x.length, y.length); i++) { const d = (x[i] || 0) - (y[i] || 0); if (d) return d; } return 0; };
function updBase() { let u = ""; try { u = localStorage.getItem("aetherforge-upd") || ""; } catch (e) { } u = (u || window.AETHERFORGE_UPD || UPD_DEFAULT).trim(); if (u && !u.endsWith("/")) u += "/"; return u; }
async function checkUpdate(quiet) {
  if (inViewer()) return; UPD.state = "checking"; if (!quiet) backupsScreen(UPD.back);
  try { const r = await fetch(updBase() + "version.json?t=" + Date.now(), { cache: "no-store" }); if (!r.ok) throw 0;
    UPD.info = await r.json(); UPD.state = verCmp(UPD.info.version, VERSION) > 0 ? "available" : "current"; }
  catch (e) { UPD.state = "error"; }
  if (!quiet || UPD.state === "available") { if (mode === "title" && quiet) titleScreen(); else if (!quiet) backupsScreen(UPD.back); }
}
async function downloadUpdate() {
  const base = updBase(), info = UPD.info; if (!info) return; UPD.state = "downloading"; backupsScreen(UPD.back);
  try { const r = await fetch(base + (info.file || "Aetherforge.html") + "?t=" + Date.now(), { cache: "no-store" }); if (!r.ok) throw 0; let html = await r.text();
    const carry = `<script>window.AETHERFORGE_UPD=${JSON.stringify(base)};window.AETHERFORGE_CARRY=${JSON.stringify(G ? JSON.stringify(G) : "").replace(/</g, "\\u003c")};<\/script>`;
    html = /<body[^>]*>/i.test(html) ? html.replace(/<body[^>]*>/i, m => m + "\n" + carry) : carry + html;
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([html], { type: "text/html" })); a.download = "Aetherforge.html";
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 3000); UPD.state = "downloaded"; }
  catch (e) { UPD.state = "error"; }
  backupsScreen(UPD.back);
}
// A file that came from the updater brings the voyage along inside it.
function takeCarriedSave() {
  const t = window.AETHERFORGE_CARRY; if (!t) return; let g = null; try { g = JSON.parse(t); } catch (e) { return; } if (!g || !g.ship) return;
  try { if (window.AETHERFORGE_UPD) localStorage.setItem("aetherforge-upd", window.AETHERFORGE_UPD); } catch (e) { }
  const mark = (g.gid || "") + ":" + Math.floor(g.day || 0); let seen = ""; try { seen = localStorage.getItem("aetherforge-carried") || ""; } catch (e) { }
  if (seen === mark) return; try { localStorage.setItem("aetherforge-carried", mark); } catch (e) { }
  let local = null; try { local = JSON.parse(localStorage.getItem(SAVE_KEY) || "null"); } catch (e) { }
  if (!local || (local.gid === g.gid && (g.day || 0) >= (local.day || 0))) { try { localStorage.setItem(SAVE_KEY, JSON.stringify(g)); } catch (e) { } toast(`Updated to version ${VERSION}. Your voyage came along.`, 4000); return; }
  if (local.gid !== g.gid) { snapshotData("carried", JSON.stringify(g), g); toast("This update carried a different voyage. It's waiting under Backups.", 5000); }
}

// ---------- the Backups & updates screen ----------
function backupsScreen(back) {
  UPD.back = back = back || UPD.back || titleScreen;
  const when = t => new Date(t).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  const why = { auto: "Automatic", restore: "Before a restore", newgame: "Before a new captain", carried: "Carried by an update" };
  const snaps = getBackups();
  let cloud;
  if (!inViewer()) cloud = `<p class="note" style="margin:0">Cloud backup works when you play on claude.ai. Here, use backup files.</p>`;
  else if (!CL.ready) cloud = `<p class="note" style="margin:0">${CL.err ? "The cloud backup isn't reachable right now." : "Connecting to your cloud backup…"}</p>`;
  else cloud = `<p class="note" style="margin:0">Your voyage is backed up to your claude.ai account every couple of minutes while you play. It survives clearing this browser's data and follows you to other devices.${CL.meta ? ` Last backup: ${esc(CL.meta.sum)}, ${when(CL.meta.at)}.` : " No cloud backup yet."}${CL.err ? ` <span style="color:var(--bad)">The last attempt failed.</span>` : ""}</p>
      <div class="row" style="margin-top:8px;gap:6px">${G && G.ship ? `<button class="b sm" id="bkCloudNow">Back up now</button>` : ""}${CL.meta ? `<button class="b sm" id="bkCloudLoad">Restore cloud backup</button>` : ""}</div>`;
  let upd;
  if (inViewer()) upd = `<p class="note" style="margin:0">You're playing the online version (${VERSION}). It's always the newest when you open it.</p>`;
  else {
    const i = UPD.info, st = UPD.state;
    const msg = st === "checking" ? "Checking…" : st === "current" ? `<span style="color:var(--good)">You have the newest version.</span>` :
      st === "available" ? `<span style="color:var(--brass-hi)">Version ${esc(i.version)} is available.</span>${i.notes ? " " + esc(i.notes) : ""}` :
      st === "downloading" ? "Downloading…" : st === "downloaded" ? `<span style="color:var(--good)">Downloaded Aetherforge.html ${esc(i.version)}, with your voyage inside.</span> Replace your old file with it and open it.` :
      st === "error" ? `<span style="color:var(--bad)">Couldn't reach the update address.</span>` : "";
    upd = `<p class="note" style="margin:0">This copy is version ${VERSION}. ${msg}</p>
      <div class="row" style="margin-top:8px;gap:6px"><button class="b sm" id="bkCheck">Check for update</button>${st === "available" ? `<button class="b sm main" id="bkGet">Download ${esc(i.version)}</button>` : ""}</div>
      <label class="f" for="bkUrl">Update address</label><div class="row" style="gap:6px;flex-wrap:nowrap"><input class="f" id="bkUrl" value="${esc(updBase())}" style="min-width:0"><button class="b sm" id="bkUrlSave">Save</button></div>`;
  }
  showPanel(`
    <header><div><h2 id="pTitle">Backups and updates</h2><div class="tag">${G && G.ship ? esc(saveSummary(G)) : "No voyage loaded"}</div></div></header>
    <div class="body" style="display:grid;gap:12px">
      <div class="card"><h3>Cloud backup</h3>${cloud}</div>
      <div class="card"><h3>Backup file</h3><p class="note" style="margin:0">Save a copy of your voyage as a file, or load one back on any device.</p>
        <div class="row" style="margin-top:8px;gap:6px">${G && G.ship ? `<button class="b sm" id="bkFileSave">Save backup file</button>` : ""}<button class="b sm" id="bkFileLoad">Load backup file</button></div></div>
      <div class="card"><h3>Snapshots</h3><p class="note" style="margin:0 0 6px">The last five saves kept in this browser, taken every 10 days at sea and before any restore.</p>
        ${snaps.length ? `<table class="t"><tbody>${snaps.map((s, i) => `<tr><td>${esc(s.sum)}<div class="note">${why[s.reason] || "Snapshot"} · ${when(s.at)}</div></td><td class="r"><button class="b sm" data-snap="${i}">Restore</button></td></tr>`).join("")}</tbody></table>` : `<p class="note" style="margin:0">None yet.</p>`}</div>
      <div class="card"><h3>Updates</h3>${upd}</div>
    </div>
    <footer><button class="b main" id="bkBack" autofocus>Back</button></footer>`, e => { if (e.key === "Escape") $("bkBack").click(); });
  $("bkBack").onclick = back;
  const on = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
  on("bkCloudNow", async () => { await cloudSave(true); toast(CL.err ? "The cloud backup failed." : "Backed up to your account."); backupsScreen(back); });
  on("bkCloudLoad", () => confirmCloud(back));
  on("bkFileSave", saveBackupFile);
  on("bkFileLoad", () => loadBackupFile(() => backupsScreen(back)));
  on("bkCheck", () => checkUpdate(false));
  on("bkGet", downloadUpdate);
  on("bkUrlSave", () => { try { localStorage.setItem("aetherforge-upd", $("bkUrl").value.trim()); } catch (e) { } toast("Update address saved."); });
  panel.querySelectorAll("[data-snap]").forEach(b => b.onclick = () => { const s = getBackups()[+b.dataset.snap]; if (!s) return;
    let g; try { g = JSON.parse(s.data); } catch (e) { toast("That snapshot couldn't be read."); return; }
    confirmLoad(`Restore ${esc(s.sum)}?`, g, () => backupsScreen(back)); });
}
function confirmCloud(back) {
  const m = CL.meta; if (!m) return;
  showPanel(`<header><h2 id="pTitle">Restore the cloud backup?</h2></header>
    <div class="body"><div class="prose"><p>${esc(m.sum)}, backed up ${new Date(m.at).toLocaleString()}.</p><p class="note">${hasSave() ? "The voyage in this browser is kept as a snapshot first." : ""}</p></div></div>
    <footer><button class="b" id="ccNo" autofocus>Cancel</button><button class="b main" id="ccYes">Restore it</button></footer>`, e => { if (e.key === "Escape") $("ccNo").click(); });
  $("ccNo").onclick = back; $("ccYes").onclick = () => restoreCloud(back);
}

// Spoiler-free manual, laid out like Starforge's: Welcome first, Controls last.
const MANUAL = [
  { t: "Welcome", h: `
    <p class="quote">"Being a captain is a dangerous job in an unforgiving aether. Being a careless one just makes it the first mate's problem."</p>
    <h3>Welcome aboard, Captain</h3>
    <p>It is 1889, and the luminiferous aether is real. Ether flyers driven by steam and apergy sail between the worlds, and the great powers race to claim Mars, Venus and Mercury. You begin with a battered packet sloop, thirty hands and a debt to settle with the villain who ruined your family.</p>
    <ul>
      <li><b>Trade.</b> Buy where goods are made and sell where they're wanted. Every port has its own prices.</li>
      <li><b>Fight.</b> Take prizes from your nation's enemies, hunt pirates, or turn pirate yourself.</li>
      <li><b>Rise.</b> Win fame and favour, and climb from Gentleman Adventurer toward the peerage.</li>
      <li><b>Meet the neighbours.</b> Mars, Venus, Mercury and the belt have peoples of their own. How you treat them decides how they treat you.</li>
      <li><b>Stay alive.</b> Hull, provisions, coal and morale are your lifelines. Watch them all.</li>
    </ul>
    <p>On the <b>title screen</b>, <b>Continue voyage</b> picks up where you left off and <b>New captain</b> starts afresh. In game, press <b>P</b> or <b>Esc</b> (or the Menu button) to pause, save, read this manual, or return to the title screen.</p>
    <p class="note">Aetherforge is in active development. Check this manual after each update; new systems arrive often.</p>` },
  { t: "Known Species", h: `
    <p>Seven peoples share the inner worlds with the colonists from Earth. Each keeps its own opinion of you, separate from the nations, and each is best at one officer's post.</p>
    <table class="t"><thead><tr><th>Species</th><th>Home</th><th>Best as</th></tr></thead><tbody>
      <tr><td><b>Ossari</b></td><td>The canal cities of Mars. Ancient merchant princes who speak in chords.</td><td>Factor</td></tr>
      <tr><td><b>Skarr</b></td><td>The Martian high deserts. Proud raiders and duellists.</td><td>Marine captain</td></tr>
      <tr><td><b>Lumari</b></td><td>The Venusian swamps. Walking plant-folk, healers and naturalists.</td><td>Surgeon</td></tr>
      <tr><td><b>Kesh</b></td><td>The Venusian cloud highlands. Insect-folk who are never lost.</td><td>Navigator</td></tr>
      <tr><td><b>Selenn</b></td><td>Mercury's twilight belt. Crystal light-singers untouched by heat.</td><td>Lens-singer</td></tr>
      <tr><td><b>Vorrn</b></td><td>The Phaeton belt. Stout miners and engineers.</td><td>Engineer</td></tr>
      <tr><td><b>Krillian</b></td><td>Belt rocks and pirate havens. Salvagers who will buy anything.</td><td>Quartermaster</td></tr>
      <tr><td><b>Humans</b></td><td>Earth and every colony.</td><td>Any post, though not to the same height</td></tr>
    </tbody></table>
    <p class="note">What you trade, whom you attack and how you treat their officers all count with each people. Listen to them in the public houses; they know more than they say.</p>` },
  { t: "The Aether", h: `
    <p>Aetherforge's solar system works the way the Victorians believed it did. Every wonder here comes from a real theory of the day.</p>
    <h3>The luminiferous aether</h3>
    <p>Space is filled with a thin, invisible medium. Ether flyers sail it as ships sail the sea, driven by ether screws and lifted by apergy, a repulsive force drawn from rare crystals.</p>
    <h3>The aether wind</h3>
    <p>The Sun pushes the aether outward, so voyages away from the Sun run quickly and voyages toward it beat slowly against the current.</p>
    <h3>Caloric</h3>
    <p>Heat is a fluid that soaks into hulls. Stray too near the Sun and your planking warps and your crew roasts.</p>
    <h3>The worlds</h3>
    <p>Mercury keeps one face to the Sun. Venus is a young world of swamps under endless cloud. Mars is old and drying, its cities clinging to their canals. Beyond Mars lies the Phaeton belt, the wreckage of a planet that once orbited there.</p>
    <h3>The Jovian Barrier</h3>
    <p>Past the belt the aether grows too thin and cold for any engine. No ship has crossed it.</p>` },
  { t: "Ship & Crew", h: `
    <h3>Ships</h3>
    <table class="t"><thead><tr><th>Ship</th><th>Notes</th></tr></thead><tbody>
      <tr><td><b>Packet sloop</b></td><td>Small, nimble and cheap. Your first command.</td></tr>
      <tr><td><b>Gunboat</b></td><td>Heavy guns for her size, but poor against the aether wind.</td></tr>
      <tr><td><b>Martian kite-galleon</b></td><td>Sails well into the wind and carries plenty, but lightly built.</td></tr>
      <tr><td><b>Armoured cruiser</b></td><td>A strong all-rounder for a privateer.</td></tr>
      <tr><td><b>Ironclad aether frigate</b></td><td>Huge broadsides and a deep hold; slow to turn.</td></tr>
    </tbody></table>
    <h3>Crew</h3>
    <p>More hands mean faster reloads and stronger boarding parties, up to your ship's berths. Sign them on in public houses. Captured crews sometimes join you.</p>
    <p><b>Provisions</b> feed the crew: one load feeds twenty hands for a month. Run out and they'll hold out about a month before morale collapses into mutiny.</p>
    <p><b>Morale</b> slips slowly at sea, and rises when you make port, win prizes or stand the crew a round.</p>
    <h3>Your fleet</h3>
    <p>A captured ship can join your fleet, up to eight ships in all, or become your new flagship. Only the flagship fights; the others follow in your wake, adding their holds and berths. The fleet sails at the pace of its slowest ship. Each ship needs a prize crew, so a fleet takes more hands, and if your crew falls too low the weakest ships are set adrift.</p>
    <p>On the Fleet screen you can move your flag to another ship (names and upgrades stay with their ships), sell ships in port, or set them adrift at sea. A shipwright repairs the whole fleet at once. If your flagship is lost, your best remaining ship takes her place.</p>
    <h3>Officers</h3>
    <p>Seven posts can each hold one officer: navigator, surgeon, engineer, factor, marine captain, quartermaster and lens-singer. Officers sign on for a small fee, draw a small monthly retainer, and take a share of every prize. They grow more skilled with time. They can be wounded or killed in battle, and they'll leave if they go unpaid, if morale collapses, if you go too long without prize money, or if you make enemies of their people.</p>` },
  { t: "Ports", h: `
    <h3>Market</h3>
    <p>Each port makes some goods cheaply and pays well for others. Green prices are cheap for that port, amber are dear. Buying pushes the price up and selling pushes it down, and prices drift back over time.</p>
    <h3>Shipwright</h3>
    <p>Repair your hull and vanes, or trade your ship in for another. The pictures show each ship to the same scale. Capital ports build the largest warships; Martian yards build kite-galleons.</p>
    <p><b>Upgrades.</b> Fit better ether vanes, guns, hull plating and boilers, each in four steps. Every yard has its specialities: Martian yards are masters of vanes, the Vorrn at Ceres of boilers, and the capitals of guns and armour. Hover over or press and hold an upgrade to see it on your ship. Upgrades stay with the ship, so they're left behind if you change ships, though they raise her trade-in value.</p>
    <h3>Public house</h3>
    <p>Sign on sailors, hire officers, and stand the crew a round. Listen to the patrons: rumours about rich ships and good prices are usually true.</p>
    <h3>Governor</h3>
    <p>Hear the news of wars, earn a letter of marque, and receive honours from your own nation. Martian cities have a palace instead.</p>
    <p class="note">A port where you're hated will refuse you docking.</p>` },
  { t: "Sailing", h: `
    <p><b>The planets move.</b> Every world follows its true orbit, so the distance between Earth and Mars changes from month to month. A run between neighbouring worlds takes one to three weeks. Wait for a good alignment and you'll save days.</p>
    <p><b>Read the compass.</b> The blue arrow shows the aether wind; the brass needle shows your heading. Sailing with the wind is fastest. Some ships handle a sunward beat far better than others.</p>
    <p><b>Boilers</b> drive you at a steady speed whatever the wind, but burn coal. Keep some in the bunkers for emergencies, and to run from a fight.</p>
    <p><b>Hazards.</b> Aether squalls speed you along but batter the hull and vanes; steer out of them. The Sun's caloric blisters any ship that strays close. The Jovian Barrier marks the edge of the chart.</p>
    <p><b>Heave to</b> to stop and think. Time stands still while you're hove to.</p>` },
  { t: "Encounters", h: `
    <p>Sail close to a ship and she appears in the numbered list above your controls; press her number (or tap her) to approach. Hostile ships are marked.</p>
    <p>When you approach a ship, through the telescope you'll see her flag, her type, roughly what she carries and whether she means trouble. You can <b>hail</b> her for news, <b>sheer off</b>, or <b>attack</b>.</p>
    <p>Hostile ships may chase you and open fire. Fight, or stoke the boilers and run.</p>
    <h3>Battle</h3>
    <p>Your guns fire from the side facing the enemy, so turn to bring a broadside to bear. The two rings beside your ship show each broadside reloading.</p>
    <ul>
      <li><b>Solid shot</b> reaches farthest and smashes the hull.</li>
      <li><b>Chain shot</b> wrecks the ether vanes so she can't run.</li>
      <li><b>Canister</b> is short-ranged and cuts down her crew.</li>
    </ul>
    <p>A ship with no vanes or no fight left strikes her colours. Wreck her hull and she explodes. Break away far enough and the battle ends.</p>
    <h3>Boarding duels</h3>
    <p>Lay your ship against hers and the grappling hooks fly. You may <b>let the crew settle it</b>, or <b>lead the boarders</b> and fight the enemy captain yourself.</p>
    <p>In a duel every attack has one defence that stops it. The enemy's blow is called out as it is wound up, so watch for it.</p>
    <ul>
      <li><b>Chop</b> is slow and drives the enemy back furthest. <b>Duck</b> under it.</li>
      <li><b>Thrust</b> is quick and gains a little ground. <b>Parry</b> it.</li>
      <li><b>Slash</b> lies between the two. <b>Jump</b> over it.</li>
    </ul>
    <p>A blow that lands drives the loser back along the deck. Stop a blow and you may answer at once with a faster one. Drive the enemy captain to the far rail and the ship is yours; be driven to your own and you are beaten.</p>
    <p>Meanwhile the crews fight behind you. The bar at the top shows who is winning; the side with the upper hand lends its captain speed. A <b>taunt</b> heartens your crew, but leaves you open. The sabre is balanced, the rapier quicker with a shorter guard, the cutlass slower but harder-hitting.</p>
    <h3>Prizes</h3>
    <p>A captured ship gives up her gold, some of her crew and her cargo. You can add her to your fleet or make her your flagship. If you lose your flagship, your best remaining ship takes over; with no fleet, you'll be put ashore poorer but alive.</p>` },
  { t: "The Hunt", h: `
    <p>Somebody ruined your family, and you chose who at the start of the voyage. The hunt for them runs alongside everything else you do, at your own pace. <b>Captain</b>, then <b>The hunt</b>, opens a journal that always says what to do next.</p>
    <h3>Finding the lieutenants</h3>
    <p>Your nemesis works through three <b>lieutenants</b>, each with a ship. In any public house you can <b>buy a round and ask</b>. If nobody there knows, they will tell you which world to try; on the right world, somebody always talks.</p>
    <p>Once you have a name, the lieutenant's ship is marked on the chart with a red ring, and the journal can <b>set a course</b> for her. They are hostile on sight, and each is stronger than the last, so build up your ship before you go looking.</p>
    <h3>The papers</h3>
    <p>Beat a lieutenant, by taking or sinking the ship, and you get the captain's <b>papers</b>. Each set tells you where one of your <b>family</b> is held, and names the next lieutenant.</p>
    <h3>Freeing your family</h3>
    <p>Make port where one of them is held and a card appears at the top of the port screen. There are three ways:</p>
    <ul>
      <li><b>Pay</b> the price asked. Each costs more than the last.</li>
      <li><b>Appeal</b> to the governor or prince, who will listen only if you are respected there.</li>
      <li><b>Break them out by night</b>: a sword fight against the captain of the guard, with your landing party at your back. Win or lose, that port will think the worse of you.</li>
    </ul>
    <h3>The reckoning</h3>
    <p>The last lieutenant's papers give away your nemesis's <b>stronghold</b>, which is then marked on the chart. Their flagship is an ironclad frigate with a full crew, and they are the best sword you will meet.</p>
    <p class="note">After the first lieutenant falls, your nemesis sends <b>hired hunters</b> after you from time to time. They show on the chart with a red ring.</p>` },
  { t: "Landings", h: `
    <p>Every world can be landed on. Sail close and choose <b>Land</b> from the list at the bottom of the chart, or tap the world itself. Days pass while you are ashore, and the crew still eats.</p>
    <h3>Sites and surveys</h3>
    <p>Each world has one to three <b>sites</b>. A site must be <b>surveyed</b> (two days) before you can use it. Every survey also earns a report, and the learned societies pay for reports when you next make port on Earth.</p>
    <p>The Moon, the asteroids and Mercury's night side have no air. To set foot there you need <b>pressure suits</b>, sold once and for all at the shipwrights of the Earth capitals and at Ceres Haven.</p>
    <h3>Digging and collecting</h3>
    <ul>
      <li><b>Dig</b> where there is ore, coal, quicksilver, amber or apergy. A bigger crew and a good engineer dig more in a day. The easy diggings run out.</li>
      <li><b>Collect specimens</b> where there is wildlife. The museums of Earth pay well for them, and now and then a collector doesn't come back.</li>
    </ul>
    <p><b>Metal ore</b>, <b>natural specimens</b> and <b>ancient relics</b> can't be bought anywhere. Earth pays best for all three.</p>
    <h3>Expeditions</h3>
    <p>Ruins and wild country are explored by a <b>landing party</b>. Choose how many hands go, how many days of water (or air) they carry, and which officers lead them. Supplies come out of your provisions.</p>
    <p>The party advances one <b>stage</b> at a time, and each stage uses a day's supplies. At every stage something happens, and you choose what to do about it. Then you choose again: <b>push deeper</b> or <b>turn back</b>. The way home needs about half as many days as the way in. Run short and people die on the march out.</p>
    <table class="t"><thead><tr><th>Officer ashore</th><th>What they do</th></tr></thead><tbody>
      <tr><td><b>Navigator</b></td><td>Finds safer paths and a shorter way home</td></tr>
      <tr><td><b>Surgeon</b></td><td>Keeps the hurt alive</td></tr>
      <tr><td><b>Chief engineer</b></td><td>Deals with bad ground and stuck doors</td></tr>
      <tr><td><b>Marine captain</b></td><td>Leads the fighting</td></tr>
      <tr><td><b>Lens-singer</b></td><td>Reads the old writing and finds more in ruins</td></tr>
      <tr><td><b>Quartermaster</b></td><td>Packs out a bigger haul</td></tr>
      <tr><td><b>Factor</b></td><td>Gets better terms from the peoples you meet</td></tr>
    </tbody></table>
    <p class="note">Officers who go ashore can be wounded. What you find at the deepest stage can only be taken once, but you can come back and go further another day.</p>
    <h3>Outposts and coaling stations</h3>
    <p>On the Moon and the asteroids there is good ground to build on. First you need a <b>colonial charter</b>, sold by any great-power governor who thinks well of you. Then bring gold and <b>machinery</b> in your hold.</p>
    <ul>
      <li>A <b>coaling station</b> wins rock-coal from the ground, so you can fill your bunkers for nothing far from any port.</li>
      <li>A <b>mining outpost</b> works whatever the site holds: ore, quicksilver or apergy.</li>
    </ul>
    <p>Both pile up cargo for you to load, keep a <b>warehouse</b> for your own goods, and can be enlarged twice. When the bunkers are full, the surplus is sold to passing ships at half price and the takings wait for you.</p>
    <p>Pirates, and your charter's enemies in wartime, <b>raid</b> lonely stations. Leave hands as a <b>garrison</b> and build a <b>palisade and gun</b>. A beaten station loses its stores, and now and then is burned and must be rebuilt. The <b>Holdings</b> button on the chart lists your stations as last reported.</p>` },
  { t: "Nations", h: `
    <p>Britain, Germany, France and Russia each hold colonies on Mars and Venus, and the Martian city-states rule the rest. Wars start and end as months pass; the public houses and governors carry the news.</p>
    <p>Attack a nation's ships and it turns against you. Attack its enemies and it warms to you. Pirates are fair game for everyone.</p>
    <p>A <b>letter of marque</b> makes raiding an enemy's ships lawful and earns more fame. Fame and your own nation's favour bring <b>honours</b>, from Gentleman Adventurer upward, each with a reward.</p>
    <p class="note">The Martian courts have honours of their own for outlanders who earn their trust.</p>` },
  { t: "Network", h: `
    <p>The <b>heliograph network</b> lets you play alongside friends. Each captain keeps their own game, calendar and save; the network shows you each other and carries your signals.</p>
    <h3>Opening and joining a circuit</h3>
    <p>Open the pause menu and choose <b>Heliograph network</b>. One captain opens a circuit and gets a code, such as BRASS-417, to give to up to three friends. They choose Join a circuit and enter it. The circuit lasts while the captain who opened it keeps the game open.</p>
    <h3>Meeting in the aether</h3>
    <p>Captains on your circuit appear on your chart, ringed in brass and named. Because every voyage keeps its own calendar, a captain is shown by where she is relative to the nearest world: if you are both near Mars, you'll find each other near Mars. Sail close and she joins your numbered list; pick her to see her ship and send a private signal.</p>
    <h3>Signals</h3>
    <p>From the Heliograph network screen you can signal every captain at once, or one privately, wherever they are.</p>
    <p class="note">Network play runs on the game's own website, not inside claude.ai. Trading, sailing together and duels between captains come in later versions.</p>` },
  { t: "Saving", h: `
    <p>Your voyage saves itself whenever you make port and every ten days at sea. Use <b>Save voyage</b> in the pause menu to save at any moment.</p>
    <p><b>Cloud backup.</b> When you play on claude.ai, a private copy of your voyage is kept in your own account. If you clear your browser or move to another device, the title screen offers to restore it.</p>
    <p><b>Snapshots.</b> The last five saves are kept in the browser. Open Saves, Backups &amp; Updates to go back to one.</p>
    <p><b>Backup files.</b> Save your voyage as a file to keep somewhere safe or to move between devices.</p>
    <p><b>Updates.</b> On claude.ai the game is always the newest version. A downloaded copy can check for updates and carries your voyage into the new file.</p>` },
  { t: "Controls", h: `
    <table class="t"><thead><tr><th>Where</th><th>Key</th><th>Action</th></tr></thead><tbody>
      <tr><td>Anywhere in game</td><td>P or Esc</td><td>Pause menu</td></tr>
      <tr><td>The chart</td><td>Click or tap</td><td>Set a course to that point, port or ship</td></tr>
      <tr><td></td><td>Arrow keys, A or D</td><td>Steer by hand</td></tr>
      <tr><td></td><td>B</td><td>Stoke or bank the boilers</td></tr>
      <tr><td></td><td>Space</td><td>Heave to</td></tr>
      <tr><td></td><td>1 to 9</td><td>Pick from the numbered list of nearby ports, ships and landing places</td></tr>
      <tr><td></td><td>Enter</td><td>The first entry in that list</td></tr>

function ensureLand() {
  if (!G) return;
  G.sites = G.sites || {}; if (G.suits == null) G.suits = false; if (G.charter === undefined) G.charter = null;
  if (G.reports == null) G.reports = 0; if (G.fragments == null) G.fragments = 0; G.landed = null;
  if (G.prices) for (const p of PORTS) for (const g in GOODS) if (G.prices[p.id] && G.prices[p.id][g] == null) G.prices[p.id][g] = targetPrice(p.id, g);

function siteState(id) { const s = SITE[id]; return G.sites[id] || (G.sites[id] = { surveyed: false, ore: s.ore ? Math.round(s.rich * 30) : 0, fauna: s.fauna ? 8 : 0, deepest: 0, done: false }); }

let landAbort = false;
// Days pass while you are ashore: the crew eats, prices drift, the world moves on.
function passDays(n) { landAbort = false; for (let i = 0; i < n && !landAbort; i++) { G.day += 1; dayTick(); } return !landAbort; }

// ---------- outposts: daily production and raids ----------
function outpostProduct(site, o) { return o.kind === "coal" ? "coal" : site.ore; }
function outpostRate(site, o) { return (LAND.rate[outpostProduct(site, o)] || 0.5) * (1 + 0.5 * (o.lvl - 1)); }
function outpostCap(site, o) { return Math.round(outpostRate(site, o) * LAND.capDays); }
function outpostsDaily() {
  for (const { site, o } of outposts()) {
    if (o.ruined) continue;
    // what the bunkers can't hold is sold to passing ships at half price, and the money waits for you
    const made = outpostRate(site, o), room = outpostCap(site, o) - o.stock, over = Math.max(0, made - room);
    o.stock += made - over; if (over > 0) o.till = (o.till || 0) + over * GOODS[outpostProduct(site, o)].b * 0.5;
    if (G.day - o.built > 60 && Math.random() < (site.risk || 1) / 110) {   // raiders take a couple of months to hear of a new station
      const atWarNow = G.charter && enemiesOf(G.charter).length > 0;
      const who = atWarNow && Math.random() < 0.4 ? `${NATIONS[pickOne(enemiesOf(G.charter))].adj} raiders` : site.risk > 1.4 ? "Pirates from the havens" : "Belt pirates";
      const str = rnd(5, 20) * (site.risk || 1), def = o.garrison * 1.2 + (o.wall ? 12 : 0);
      if (def >= str) { o.raids = (o.raids || 0) + 1; logMsg(`${who} attacked ${o.name} and were driven off.`); toast(`News by heliograph: ${who.toLowerCase()} attacked ${o.name}. The garrison drove them off!`, 4500); G.fame += 1; }
      else {
        const frac = rnd(0.5, 1), lostMen = Math.min(o.garrison, Math.round(o.garrison * rnd(0.2, 0.5)));
        o.stock *= 1 - frac; o.till = Math.floor((o.till || 0) * (1 - frac)); for (const g in o.store) { o.store[g] = Math.floor(o.store[g] * (1 - frac)); if (o.store[g] <= 0) delete o.store[g]; }
        o.garrison -= lostMen;
        if (def < str * 0.5 && Math.random() < 0.2) { o.ruined = true; logMsg(`${who} sacked and burned ${o.name}.`); toast(`News by heliograph: ${who.toLowerCase()} have burned ${o.name}. It will have to be rebuilt.`, 5200); }
        else { logMsg(`${who} raided ${o.name} and carried off its stores.`); toast(`News by heliograph: ${who.toLowerCase()} have raided ${o.name} and carried off ${frac > 0.9 ? "everything" : "much of its stores"}.`, 5000); }
      }
    }
  }
}

function siteCard(s) {

function outpostInfo(s, o) {

function siteAct(s, act) {

  else if (act === "dig") {
    const n = Math.floor(Math.min(st.ore, cargoFree(), Math.max(1, s.rich * Math.min(1, G.ship.crew / 30) * (1 + 0.5 * eff("eng")))));
    if (n < 1) return toast("The hold is full.");
    if (!passDays(1)) return; st.ore -= n; addCargo(s.ore, n); G.ship.morale = clamp(G.ship.morale - 1, 0, 100);
    back(`A day with pick and shovel puts ${n} ton${n > 1 ? "s" : ""} of ${GOODS[s.ore].n.toLowerCase()} in the hold.`); }
  else if (act === "hunt") {
    if (!passDays(1)) return; const n = Math.min(Math.floor(st.fauna), ri(1, 3), Math.floor(cargoFree())); st.fauna -= n; addCargo("specimens", n);
    let extra = ""; if (Math.random() < 0.25 * (1 - 0.6 * eff("surgeon")) && G.ship.crew > 5) { G.ship.crew--; extra = " One of the collectors didn't come back."; }
    back(`Your naturalists bring back ${n} crate${n > 1 ? "s" : ""} of specimens.${extra}`); }
  else if (act === "exp") expeditionSetup(s);

  else if (act === "rebuild") { const o = st.outpost, c = LAND.build[o.kind].gold / 2; if (G.gold < c) return; G.gold -= c; o.ruined = false; o.stock = 0; logMsg(`Rebuilt ${o.name}.`); back(`${o.name} is rebuilt and working again.`); }
}

      return `<div class="card"><h3>${b.n}</h3><p class="note">${k === "coal" ? "Retorts and bunkers that win rock-coal from the ground. Fill your bunkers here for nothing." : `Shafts and a crusher that work the ${GOODS[s.ore].n.toLowerCase()} all year round.`}

      <p class="note">Raiders call at lonely stations. Leave a garrison, and build a palisade when you can.</p>`;
  }
  showPanel(`<header><div><h2 id="pTitle">Build at ${esc(s.name)}</h2><div class="tag">${esc(bodyName(s.body))}</div></div><div class="tag num">${fmtGold(G.gold)}</div></header><div class="body">${body}</div>
    <footer><button class="b main" id="bsBack" autofocus>Back</button></footer>`, e => { if (e.key === "Escape") back(); });
  $("bsBack").onclick = back;

    if (!passDays(3)) return; G.gold -= c.gold; addCargo("machinery", -c.mach);

    siteState(s.id).outpost = { kind: k, name: nm, lvl: 1, stock: 0, store: {}, garrison: 0, wall: false, built: Math.floor(G.day), ruined: false };

}

}

// ---------- the chart: outposts shown beside their worlds ----------
function drawOutposts(c, toS, z) {
  for (const { site, o } of outposts()) {
    const b = bodyPos(site.body, G.day), r = bodySize(site.body) + 5, [x, y] = toS(b.x - r * 0.7, b.y - r * 0.7);
    c.strokeStyle = "#e8c873"; c.lineWidth = 1.4; c.beginPath(); c.moveTo(x, y + 6); c.lineTo(x, y - 7); c.stroke();
    c.fillStyle = o.ruined ? "#6d5d4a" : NATIONS[G.charter || G.nation].col; c.beginPath(); c.moveTo(x, y - 7); c.lineTo(x + 8, y - 4.5); c.lineTo(x, y - 2); c.closePath(); c.fill();
    if (z > 0.9) { c.font = `12px "Alegreya Sans", system-ui, sans-serif`; c.textAlign = "right"; c.fillStyle = "rgba(232,200,115,.9)"; c.fillText(o.name, x - 5, y + 3); }
  }
}

// ===================== EXPEDITIONS (0.32) =====================
// A landing party pushes into ruins or wild country one stage at a time. Every stage costs a
// day's supplies (water, or air on airless ground). Push deeper for better finds, or turn back
// while you still can.
let X = null;
const XPOSTS = { nav: "finds the way", surgeon: "tends the hurt", eng: "handles machinery and rock", marine: "leads the fighting", lens: "reads old writing", qm: "packs more out", factor: "deals with strangers" };

function expeditionSetup(s, pick) {
  const st = siteState(s.id), back = () => openLanding(s.body), maxParty = Math.max(0, Math.min(20, G.ship.crew - 6));
  pick = pick || { party: Math.min(10, maxParty), sup: Math.min(s.exp.depth + 2, 8), offs: G.officers.filter(o => !(o.wounded > G.day)).map(o => o.id) };
  const what = s.suits ? "air" : "water", cost = Math.ceil(pick.party * pick.sup / 25);
  const offs = G.officers.map(o => { const hurt = o.wounded > G.day;
    return `<label class="chk"><input type="checkbox" data-off="${o.id}"${pick.offs.includes(o.id) && !hurt ? " checked" : ""}${hurt ? " disabled" : ""}> <b>${esc(o.name)}</b>, ${POSTS[o.post].n.toLowerCase()} <span class="note">${hurt ? "wounded, stays aboard" : XPOSTS[o.post] || ""}</span></label>`; }).join("");
  showPanel(`<header><div><h2 id="pTitle">${s.exp.kind === "ruin" ? "Into the ruins" : "Into the wild"}</h2><div class="tag">${esc(s.name)}, ${esc(bodyName(s.body))}</div></div><div class="tag num">${G.ship.crew} hands · provisions ${Math.floor(has("provisions"))}</div></header>
    <div class="body"><canvas class="scene wide" id="xsScene"></canvas>
      <div class="prose"><p>${s.exp.kind === "ruin" ? `The way in is ${s.exp.depth} stages deep, as near as anyone can tell.` : `The country runs ${s.exp.depth} stages from the landing ground to its heart.`} ${st.deepest ? `Your people have been as far as stage ${st.deepest}.` : "Nobody you know has been inside."}
        Each stage uses one day's ${what}, and you'll need about half as much again to come back.</p></div>
      <div class="grid2">
        <div class="card"><h3>The party</h3><p class="note">More hands fight better and carry more, but drink more. Six stay to mind the ship.</p>
          <div class="row" style="gap:6px"><button class="b sm" id="xsP0">−2</button><b class="num" style="min-width:5ch;text-align:center">${pick.party} hands</b><button class="b sm" id="xsP1">+2</button></div></div>
        <div class="card"><h3>${s.suits ? "Air bottles" : "Water and rations"}</h3><p class="note">${pick.sup} days' ${what} for ${pick.party} hands takes ${cost} load${cost === 1 ? "" : "s"} of provisions from the hold.</p>
          <div class="row" style="gap:6px"><button class="b sm" id="xsS0">−1</button><b class="num" style="min-width:5ch;text-align:center">${pick.sup} days</b><button class="b sm" id="xsS1">+1</button></div></div>
      </div>
      ${offs ? `<h3 style="font:20px var(--display);color:var(--brass-hi);margin:14px 0 4px">Officers going ashore</h3><div class="chks">${offs}</div><p class="note">Officers ashore share the dangers.</p>` : `<p class="note">You have no officers to send. They would make this safer.</p>`}
    </div>
    <footer><button class="b" id="xsBack">Back</button><button class="b main" id="xsGo" autofocus${pick.party >= 4 && has("provisions") >= cost ? "" : " disabled"}><span class="key">↵</span>Set out</button></footer>`,
    e => { if (e.key === "Escape") back(); });
  drawLandScene($("xsScene"), s, { camp: true, wide: true, party: Math.min(8, pick.party), marching: true });
  const read = () => { pick.offs = [...panel.querySelectorAll("[data-off]:checked")].map(i => +i.dataset.off || i.dataset.off); };
  const re = () => { read(); expeditionSetup(s, pick); };
  $("xsBack").onclick = back;
  $("xsP0").onclick = () => { pick.party = Math.max(4, pick.party - 2); re(); }; $("xsP1").onclick = () => { pick.party = Math.min(maxParty, pick.party + 2); re(); };
  $("xsS0").onclick = () => { pick.sup = Math.max(2, pick.sup - 1); re(); }; $("xsS1").onclick = () => { pick.sup = Math.min(12, pick.sup + 1); re(); };
  $("xsGo").onclick = () => { read(); if (pick.party < 4) return toast("You need at least four hands."); if (has("provisions") < cost) return toast("Not enough provisions for that.");
    addCargo("provisions", -cost);
    X = { s, kind: s.exp.kind, max: s.exp.depth, depth: 0, party: pick.party, hurt: 0, dead: 0, sup: pick.sup, haul: {}, gold: 0, fame: 0, offs: pick.offs.map(String), notes: [], what, hurtOffs: [] };
    logMsg(`Sent ${pick.party} hands into ${s.name}.`); xAdvance(); };
}
const xOff = post => { const o = officerAt(post); return o && X.offs.includes(String(o.id)) && !(o.wounded > G.day) ? o : null; };
const xeff = post => xOff(post) ? eff(post) : 0;
const xAble = () => X.party - X.hurt - X.dead;
function xHurt(n) { n = Math.max(0, Math.min(Math.round(n), xAble())); X.hurt += n; return n; }
function xKill(n) { n = Math.max(0, Math.min(Math.round(n), X.party - X.dead)); const fromHurt = Math.min(X.hurt, n); X.hurt -= fromHurt; X.dead += n; return n; }
function xGain(g, n) { n = Math.round(n * (1 + 0.3 * xeff("qm"))); if (n > 0) X.haul[g] = (X.haul[g] || 0) + n; return n; }
function xOfficerRisk(p) { for (const id of X.offs) { const o = G.officers.find(q => String(q.id) === id); if (o && !(o.wounded > G.day) && Math.random() < p) { o.wounded = G.day + ri(15, 30); X.hurtOffs.push(o.name); return o; } } return null; }
const men = n => n === 1 ? "one man" : `${n} men`;

// ----- the events -----
const XPLACE = {

// ===================== AETHERFORGE GAME =====================
const $ = id => document.getElementById(id);
const SAVE_KEY = "aetherforge-save-v1";
let G = null;            // the whole game state (saved)
let paused = false;      // heave to
let mode = "title";      // title | map | port | battle | panel

// ---------- small helpers ----------
// Flagship figures, with the whole fleet's berths and hold added in.
function shipDef() { const d = upgradedDef(G.ship); for (const f of (G.fleet || [])) { d.crew += SHIPS[f.type].crew; d.cargo += SHIPS[f.type].cargo; } return d; }
const cargoUsed = () => Object.values(G.cargo).reduce((a, b) => a + b, 0);
const cargoFree = () => Math.max(0, shipDef().cargo - cargoUsed());
const has = k => G.cargo[k] || 0;
function addCargo(k, n) { G.cargo[k] = (G.cargo[k] || 0) + n; if (G.cargo[k] <= 0.0001) delete G.cargo[k]; }
const rankOf = () => rankTitle();
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function repWord(v) { return v <= -50 ? "Hated" : v <= -25 ? "Hostile" : v < -5 ? "Wary" : v < 15 ? "Neutral" : v < 40 ? "Friendly" : v < 70 ? "Respected" : "Honoured"; }
function dateStr(day) {
  const d = new Date(Date.UTC(1889, 0, 1) + Math.floor(day) * 864e5);
  return d.getUTCDate() + " " + ["January","February","March","April","May","June","July","August","September","October","November","December"][d.getUTCMonth()] + " " + d.getUTCFullYear();
}
function logMsg(t) { G.log.unshift({ d: Math.floor(G.day), t }); if (G.log.length > 120) G.log.length = 120; }
let toastT = 0;
function toast(t, ms = 3200) { const el = $("toast"); el.textContent = t; delete el.dataset.off; clearTimeout(toastT); toastT = setTimeout(() => el.dataset.off = "", ms); }
const atWar = (a, b) => G.wars.some(w => (w[0] === a && w[1] === b) || (w[0] === b && w[1] === a));
const enemiesOf = n => GREAT.concat("mars").filter(m => m !== n && atWar(n, m));

// ---------- the moving orrery ----------
function bodyPos(id, day) {
  const p = PLANETS.find(q => q.id === id);
  if (p) { const a = p.a0 + TAU * day / p.period; return { x: Math.cos(a) * p.r, y: Math.sin(a) * p.r }; }
  const m = MINOR[id]; const a = m.a0 + TAU * day / m.period;
  if (m.parent) { const c = bodyPos(m.parent, day); return { x: c.x + Math.cos(a) * m.r, y: c.y + Math.sin(a) * m.r }; }
  return { x: Math.cos(a) * m.r, y: Math.sin(a) * m.r };
}
function bodySize(id) { const p = PLANETS.find(q => q.id === id); return p ? p.size : MINOR[id].size; }
function portPos(port, day) {
  const b = bodyPos(port.body, day ?? G.day);
  const planet = PLANETS.some(q => q.id === port.body);
  const r = planet ? bodySize(port.body) + 12 : bodySize(port.body) + 6;
  return { x: b.x + Math.cos(port.off) * r, y: b.y + Math.sin(port.off) * r };
}
const windDir = (x, y) => Math.atan2(y, x);
const windStr = (x, y) => clamp(1.25 - Math.hypot(x, y) / (900 * WORLD), 0.45, 1.2);
function sailFactor(h, wd, ww) { return ww + (1 - ww) * (1 + Math.cos(angDiff(wd, h))) / 2; }

// ---------- economy ----------
function targetPrice(port, g) {
  const p = PORT[port]; let m = 1;
  if (p.make.includes(g)) m = 0.55; else if (p.want.includes(g)) m = 1.6;
  if (p.kind === "haven") m *= p.make.includes(g) ? 1 : 1.1;
  return GOODS[g].b * m;
}
function initPrices() {
  G.prices = {};
  for (const p of PORTS) { G.prices[p.id] = {}; for (const g in GOODS) G.prices[p.id][g] = targetPrice(p.id, g) * rnd(0.85, 1.15); }
}
function driftPrices() {
  for (const p of PORTS) for (const g in GOODS) {
    const t = targetPrice(p.id, g), cur = G.prices[p.id][g];
    G.prices[p.id][g] = clamp(cur + (t - cur) * 0.06 + t * rnd(-0.03, 0.03), t * 0.4, t * 2.4);
  }
}
const charm = () => G.skill === "charm" ? 0.06 : 0;
const buyPrice = (port, g) => Math.max(1, Math.round(G.prices[port][g] * (1 - charm() - 0.08 * eff("factor"))));
const sellPrice = (port, g) => Math.max(1, Math.round(G.prices[port][g] * 0.88 * (1 + charm() + 0.08 * eff("factor") + (PORT[port].kind === "haven" ? 0.1 * eff("qm") : 0))));

// ---------- new game ----------
function newGame(o) {
  const home = HOME[o.nation];
  G = {
    v: VERSION, captain: o.captain, shipName: o.shipName, nation: o.nation, skill: o.skill, villain: o.villain,
    day: 0, gold: 600, fame: 0, rank: 0,
    ship: { type: "sloop", hull: 60, vanes: 50, crew: 30, morale: 70, x: 0, y: 0, h: 0 },
    cargo: { provisions: 6, coal: 14 },
    rep: { gb: 0, de: 0, fr: 0, ru: 0, mars: 0, pirate: -20, free: 10 },
    marque: [], wars: [], nextWarDay: 140,
    ais: [], storms: [], log: [], docked: home, boilers: false, target: null,
    foodAcc: 0, nextAi: 1, worldScale: WORLD
  };
  ensureV2();
  G.rep[o.nation] = 30;
  const pairs = [];
  for (let i = 0; i < 4; i++) for (let j = i + 1; j < 4; j++) pairs.push([GREAT[i], GREAT[j]]);
  G.wars.push(pickOne(pairs.filter(p => !p.includes(o.nation))));
  if (Math.random() < 0.6) { const p = pickOne(pairs.filter(p => !G.wars.some(w => w.join() === p.join()))); G.wars.push(p); }
  initPrices();
  const pp = portPos(PORT[home], 0); G.ship.x = pp.x; G.ship.y = pp.y;
  for (let i = 0; i < 12; i++) spawnAi(true);
  for (let i = 0; i < 3; i++) spawnStorm();

  logMsg(`Sworn to find ${VILLAINS[o.villain].n}.`);
  save();
}

const PIRATE_NAMES = ["Black Comet", "Widow's Lantern", "Rusty Halo", "Scourge of Phaeton", "Gallows Moon", "Nine Lives", "Crimson Orrery", "Dead Reckoning"];
function spawnAi(anywhere) {

  if (role === "pirate") {
    nat = "pirate"; type = pickOne(["sloop", "sloop", "gunboat", "kite"]);
    from = pickOne(["deimos", "pallas", "pallas", "ceres"]); gold = ri(250, 1200);
    if (from === "deimos" && Math.random() < 0.6) { type = "kite"; var corsair = true; }
    const g = pickOne(Object.keys(GOODS)); cargo[g] = ri(5, 20);
  } else {
    nat = Math.random() < 0.15 ? "mars" : pickOne(GREAT);

    if (has("coal") > 0) { f = (Math.max(f, 0.6) + 0.25) * def.steamMult; addCargo("coal", -0.5 * pace.size * def.coalMult * (G.skill === "phil" ? 0.7 : 1) * (1 - 0.35 * eff("eng")) * dd); if (!has("coal")) { G.boilers = false; $("btnBoil").classList.remove("on"); toast("The last of the coal is gone. Boilers out."); } }
  }
  let inStorm = null;
  for (const st of G.storms) { st.x += st.vx * dd; st.y += st.vy * dd; if (Math.hypot(st.x - s.x, st.y - s.y) < st.r) inStorm = st; }
  if (inStorm) { const sk = (G.skill === "phil" ? 0.5 : 1) * (1 - 0.5 * eff("lens")); f *= 1.35; s.hull -= 2.2 * dd * sk; s.vanes -= 1.2 * dd * sk;
    if (Math.random() < dd * 0.6) toast("The squall batters the hull. Steer out of it!", 1600);
    if (s.hull <= 0) { s.hull = 0; defeat("The aether squall tore the ship apart. You were picked up by a passing packet."); return; } s.vanes = Math.max(5, s.vanes); }
  const v = 42 * WORLD * pace.spd * f * (0.35 + 0.65 * s.vanes / def.vanes) * (G.skill === "nav" ? 1.12 : 1) * (1 + 0.15 * eff("nav"));
  s.x += Math.cos(s.h) * v * dd; s.y += Math.sin(s.h) * v * dd;
  const r = Math.hypot(s.x, s.y);
  if (r > EDGE) { s.x *= EDGE / r; s.y *= EDGE / r; if (Math.random() < 0.02) toast("The Jovian Barrier. The aether is too thin for your engines past here."); }
  if (r < 60 * WORLD * (1 - 0.5 * eff("lens"))) { s.hull -= 6 * dd * (1 - eff("lens") * 0.6); if (Math.random() < 0.05) toast("Too close to the Sun! The caloric is blistering the paint."); if (s.hull <= 0) { s.hull = 0; defeat("You flew too near the Sun. The hull warped and failed."); return; } }

}

function nearestPortName() {

  for (const p of PLANETS) { const b = bodyPos(p.id, G.day); if (Math.hypot(b.x - G.ship.x, b.y - G.ship.y) < 50 * WORLD) return p.name; }

}
const ccv = $("compass"), cc = ccv.getContext("2d");

  const s = G.ship, wd = windDir(s.x, s.y), ws = windStr(s.x, s.y);
  c.save(); c.translate(W / 2, W / 2);
  c.fillStyle = "#170f09"; c.beginPath(); c.arc(0, 0, 88, 0, TAU); c.fill();
  c.strokeStyle = "#c9a14a"; c.lineWidth = 6; c.stroke();
  c.strokeStyle = "#7d6029"; c.lineWidth = 2; c.beginPath(); c.arc(0, 0, 74, 0, TAU); c.stroke();
  for (let i = 0; i < 16; i++) { const a = i / 16 * TAU, l = i % 4 ? 6 : 12; c.beginPath(); c.moveTo(Math.cos(a) * 74, Math.sin(a) * 74); c.lineTo(Math.cos(a) * (74 - l), Math.sin(a) * (74 - l)); c.stroke(); }
  // wind arrow
  c.rotate(wd); c.strokeStyle = "#8fb3c9"; c.fillStyle = "#8fb3c9"; c.lineWidth = 5;
  c.beginPath(); c.moveTo(-50, 0); c.lineTo(36 * (0.6 + ws * 0.4), 0); c.stroke();

// Market

      <button class="b sm" data-sell="${g}" data-n="1">Sell</button><button class="b sm" data-sell="${g}" data-n="all">All</button></div></td></tr>`;
  }).join("");
  $("portBody").innerHTML = `<p class="note" style="margin-top:0">Green prices are cheap for this port; amber are dear. One load of provisions feeds twenty hands for a month, and coal feeds the boilers.</p>
    <div style="overflow-x:auto" class="mk"><table class="t"><thead><tr><th>Goods</th><th class="r">Buy</th><th class="r">Sell</th><th class="r hideN">Hold</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
  $("portBody").onclick = e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.buy) { const g = b.dataset.buy; let n = +b.dataset.n; n = Math.min(n, Math.floor(cargoFree()), Math.floor(G.gold / buyPrice(p.id, g)));
      if (n <= 0) { toast(cargoFree() < 1 ? "The hold is full." : "You can't afford that."); return; }
      let cost = 0; for (let i = 0; i < n; i++) { cost += buyPrice(p.id, g); G.prices[p.id][g] *= 1.012; }
      G.gold -= cost; addCargo(g, n); speciesFromTrade(p.id, g, n, true); }
    if (b.dataset.sell) { const g = b.dataset.sell; let n = b.dataset.n === "all" ? Math.floor(has(g)) : Math.min(1, Math.floor(has(g)));

  };
}

// Public house: crew for hire, and patrons of many species
let lastTipAi = null;
function makeTavern(p) {
  const n = p.kind === "station" ? 2 : 3, pats = [];
  const used = new Set();
  for (let i = 0; i < n; i++) {
    let sp = pickOne(p.sp); if (used.has(sp) && p.sp.length > 1 && Math.random() < 0.7) sp = pickOne(p.sp.filter(x => !used.has(x)).concat(sp)); used.add(sp);
    lastTipAi = null; const line = patronLine(p, sp);
    pats.push({ sp, seed: ri(1, 99999), name: speciesName(sp), hello: pickOne(GREETINGS[sp]), line, ai: lastTipAi });
  }
  const offs = []; const no = p.kind === "station" ? 1 : ri(1, 2);
  for (let i = 0; i < no; i++) offs.push(makeOfficer(pickOne(p.sp), p));
  return { port: p.id, day: Math.floor(G.day), hands: p.kind === "station" ? ri(2, 8) : ri(6, 26), pats, offs };
}
function speciesName(sp) {
  const b = NAMEBITS[sp]; if (sp === "Human") return pickOne(b.f) + " " + pickOne(b.l);
  return pickOne(b.a) + pickOne(b.b);
}
function patronLine(p, sp) {
  const roll = Math.random();
  if (roll < 0.3) { const tip = shipTip(p); if (tip) return tip; }
  if (roll < 0.55) return priceTip(p);
  if (roll < 0.7) return warTip();
  if (roll < 0.88) return pickOne(SPECIES_LORE[sp] || SPECIES_LORE.Human);
  return pickOne(TALL_TALES);
}
function shipTip(p) {
  const rich = G.ais.filter(a => a.role !== "navy" && (a.gold > 350 || Object.values(a.cargo).reduce((x, y) => x + y, 0) > 25));
  if (!rich.length) return null;
  const a = pickOne(rich); lastTipAi = a.id;
  const where = a.role === "pirate" ? `prowling ${regionName(a.x, a.y).toLowerCase().replace("the ", "the ")}` : `bound for ${PORT[a.dest].name}`;
  return a.role === "pirate" ? `The pirate ${shipWord(a.type)} ${a.name} is ${where}. They say her captain keeps his plunder aboard.` :
    `A ${NATIONS[a.nat].adj} ${shipWord(a.type)}, the ${a.name}, left ${PORT[a.from].name} ${where}, ${cargoHint(a)}.`;
}
function priceTip(p) {
  const g = pickOne(Object.keys(GOODS));
  let best = null, bv = 0;
  for (const q of PORTS) if (q.id !== p.id) { const v = G.prices[q.id][g]; if (v > bv) { bv = v; best = q; } }
  const cheap = PORTS.filter(q => q.make.includes(g) && q.id !== best.id);
  return `${GOODS[g].n} fetches ${fmtGold(bv)} a load at ${best.name}${cheap.length ? `. You'll buy it cheaper at ${pickOne(cheap).name}` : ""}.`;
}
function warTip() {
  if (!G.wars.length) return "Peace everywhere, more's the pity. A privateer starves in peacetime.";
  const w = pickOne(G.wars);
  return `${NATIONS[w[0]].short} and ${NATIONS[w[1]].short} are at war. Either governor will pay for prizes taken from the other, if you carry their letter of marque.`;
}

        <div><div class="who">${esc(q.name)}</div><div class="kind">${SPECIES_AF[q.sp].n} · ${SPECIES_AF[q.sp].home}${G.srep[q.sp] != null ? ` · ${repWord(G.srep[q.sp]).toLowerCase()} toward you` : ""}</div>
        <div class="say">"${esc(q.hello)} ${esc(q.line)}"</div>
        ${q.ai && eff("nav") >= 0.3 && G.ais.some(a => a.id === q.ai) ? `<div class="row" style="margin-top:8px"><button class="b sm" data-track="${q.ai}">${G.track === q.ai ? "Course laid in" : "Have your navigator track her"}</button></div>` : ""}</div></div>`).join("")}</div>`;
  T.pats.forEach((q, i) => brassPortrait($("pt" + i), q.sp, q.seed));

    G.gold -= cost; o.hired = Math.floor(G.day); G.officers.push(o); T.offs = T.offs.filter(x => x !== o); srepChange(o.sp, 2);
    logMsg(`Signed ${o.name} (${SPECIES_AF[o.sp].n}) as ${POSTS[o.post].n.toLowerCase()}.`); toast(`${o.name} signs on as your ${POSTS[o.post].n.toLowerCase()}.`); openPort(p.id, "tavern");

  $("portBody").querySelectorAll("[data-track]").forEach(b => b.onclick = () => { G.track = +b.dataset.track; toast("When you cast off, your navigator will set a course to intercept her."); openPort(p.id, "tavern"); });

    G.gold -= n * wage; s.crew += n; T.hands -= n; openPort(p.id, "tavern"); };
  $("tHire1").onclick = () => hire(1); $("tHireAll").onclick = () => hire(can);
  $("tRound").onclick = () => { if (G.gold < meals) { toast("You can't stand the round."); return; } if (s.morale >= 95) { toast("The crew are already in fine spirits."); return; }
    G.gold -= meals; s.morale = clamp(s.morale + 18, 0, 100); for (const q of T.pats) srepChange(q.sp, 1); toast("The crew drink your health, and so does half the room."); openPort(p.id, "tavern"); };

// Starforge's species art, re-framed in a brass porthole with a sepia tone
function brassPortrait(cv, sp, seed) {
  if (!cv) return;
  try { drawPortrait(cv, { sp, col: speciesColor(sp), seed }); } catch (e) { return; }
  const W = cv.width, H = cv.height, tmp = document.createElement("canvas"); tmp.width = W; tmp.height = H; tmp.getContext("2d").drawImage(cv, 0, 0);
  const c = cv.getContext("2d"); c.setTransform(1, 0, 0, 1, 0, 0);
  c.fillStyle = "#24180f"; c.fillRect(0, 0, W, H);
  c.save(); c.beginPath(); c.ellipse(W / 2, H / 2, W * 0.46, H * 0.46, 0, 0, TAU); c.clip();
  c.filter = "sepia(0.9) saturate(1.35) contrast(1.08)"; c.drawImage(tmp, 0, 0); c.filter = "none";
  c.globalCompositeOperation = "multiply"; c.fillStyle = "#e8c99a"; c.fillRect(0, 0, W, H); c.globalCompositeOperation = "source-over";
  const g = c.createRadialGradient(W / 2, H / 2, W * 0.25, W / 2, H / 2, W * 0.5); g.addColorStop(0, "rgba(20,12,4,0)"); g.addColorStop(1, "rgba(20,12,4,.55)"); c.fillStyle = g; c.fillRect(0, 0, W, H);
  c.restore();
  const k = W / 112;
  c.lineWidth = 6 * k; c.strokeStyle = "#a8822f"; c.beginPath(); c.ellipse(W / 2, H / 2, W * 0.46, H * 0.46, 0, 0, TAU); c.stroke();
  c.lineWidth = 1.2 * k; c.strokeStyle = "#e0bd6a"; c.beginPath(); c.ellipse(W / 2, H / 2, W * 0.46 + 3.5 * k, H * 0.46 + 3.5 * k, 0, 0, TAU); c.stroke();
  for (let i = 0; i < 10; i++) { const a = i / 10 * TAU, x = W / 2 + Math.cos(a) * W * 0.46, y = H / 2 + Math.sin(a) * H * 0.46;
    c.fillStyle = "#5c4416"; c.beginPath(); c.arc(x, y, 1.8 * k, 0, TAU); c.fill(); c.fillStyle = "#f2d58a"; c.beginPath(); c.arc(x - 0.5 * k, y - 0.5 * k, 0.7 * k, 0, TAU); c.fill(); }
}

// Governor or palace: standing, letters of marque, honours
function renderGov(p) {
  const n = p.nat, rv = G.rep[n], name = NATIONS[n];
  if (rv < 0) { $("portBody").innerHTML = `<div class="prose"><p>The ${n === "mars" ? "prince's chamberlain" : "governor's secretary"} looks you up and down and says ${n === "mars" ? "the prince" : "His Excellency"} is not receiving visitors. Not visitors like you.</p><p class="note">Your standing with the ${name.name} is ${repWord(rv).toLowerCase()}. Take prizes from their enemies to win them over.</p></div>`; return; }
  const enemies = enemiesOf(n);
  let html = `<div class="prose"><p>${n === "mars" ? "The Ossari prince receives you on a balcony above the canal, attended by a dozen silent Skarr guards." : `The governor receives you in a study hung with charts of the ${p.body === "earth" ? "aether lanes" : "colony"}.`} Your standing with the ${name.name} is <b>${repWord(rv).toLowerCase()}</b>.</p>`;
  html += enemies.length ? `<p>${name.short} is at war with ${enemies.map(e => NATIONS[e].short).join(" and ")}.</p>` : `<p>${name.short} is at peace with everyone, for now.</p>`;
  html += `</div>`;
  const acts = [];
  if (n !== "mars" && enemies.length && !G.marque.includes(n)) {
    if (rv >= 15) acts.push(`<div class="card"><h3>Letter of marque</h3><p class="note">Licence to take ${enemies.map(e => NATIONS[e].adj).join(" and ")} ships as lawful prizes. Prizes earn more fame, and ${name.short} will reward you for them.</p><button class="b sm main" id="gMarque">Accept the letter</button></div>`);
    else acts.push(`<div class="card"><h3>Letter of marque</h3><p class="note">The governor might grant you one once you're better known here (friendly standing).</p></div>`);
  }
  if (G.marque.includes(n)) acts.push(`<div class="card"><h3>Letter of marque</h3><p class="note">You carry ${name.short}'s letter of marque.</p></div>`);
  if (n === G.nation) {
    const next = RANKS[G.rank + 1];
    if (next && G.fame >= next.f && rv >= 25) acts.push(`<div class="card"><h3>An honour</h3><p class="note">Word of your exploits has reached the Crown. You are to be made ${next.t}.</p><button class="b sm main" id="gRank">Accept the honour</button></div>`);
    else if (next) acts.push(`<div class="card"><h3>Honours</h3><p class="note">You are ${rankOf()}. The next honour, ${next.t}, needs ${next.f} fame (you have ${Math.floor(G.fame)}) and respected standing.</p></div>`);
  } else if (n !== "mars") acts.push(`<div class="card"><h3>Honours</h3><p class="note">Honours are granted by your own flag, the ${NATIONS[G.nation].name}.</p></div>`);
  $("portBody").innerHTML = html + `<div class="grid2" style="margin-top:12px">${acts.join("")}</div>`;
  if ($("gMarque")) $("gMarque").onclick = () => { G.marque.push(n); logMsg(`Granted a letter of marque by ${name.short}.`); toast(`You now sail with ${name.short}'s letter of marque.`); openPort(p.id, "gov"); };
  if ($("gRank")) $("gRank").onclick = () => { G.rank++; const reward = 400 * G.rank; G.gold += reward; G.rep[n] += 5; logMsg(`Made ${rankOf()}.`); toast(`Arise, ${rankOf()} ${G.captain}! The Crown grants you ${fmtGold(reward)}.`, 4500); openPort(p.id, "gov"); };
}

    <header><div><h2 id="pTitle">The ${esc(a.name)}</h2><div class="tag">Through the telescope: a ${esc(aiLabel(a))}</div></div></header>

      <p class="note">${warn}</p></div></div>
    <footer><button class="b" id="eLeave"><span class="key">C</span>Sheer off</button><button class="b" id="eHail"><span class="key">X</span>Hail her</button><button class="b main" id="eAtk"><span class="key">Z</span>Attack</button></footer>`,
    e => { const k = e.key.toLowerCase(); if (k === "z") $("eAtk").click(); else if (k === "x") $("eHail").click(); else if (k === "c" || k === "escape") $("eLeave").click(); });
